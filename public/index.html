<!DOCTYPE html>
<meta charset="UTF-8">
<title>Nancy Offline Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&display=swap">

<style>
:root{
  --black:#000000; --surface:#0A0A0A; --surface-2:#111111;
  --line:#1F1F1F; --line-soft:#161616;
  --white:#FFFFFF; --muted:#9B9B9B; --dim:#5E5E5E;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--black);color:var(--white);
  font-family:'Archivo',system-ui,sans-serif;-webkit-font-smoothing:antialiased;
}
.topbar{padding:34px var(--pad,18px) 10px;border-bottom:1px solid var(--line-soft)}
@media (min-width:900px){:root{--pad:34px}}
.topbar h1{font-size:clamp(22px,4vw,32px);font-weight:700;letter-spacing:-.01em;margin:0 0 6px}
.topbar p{margin:0;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
.grid{
  display:grid;gap:22px;padding:28px var(--pad,18px) 60px;
  grid-template-columns:repeat(1,1fr);
}
@media (min-width:640px){.grid{grid-template-columns:repeat(2,1fr)}}
@media (min-width:960px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{
  display:block;text-decoration:none;color:inherit;
  border:1px solid var(--line);background:var(--surface);
  transition:border-color .16s ease,transform .16s ease;
}
.card:hover{border-color:var(--muted)}
.card-cover{position:relative;aspect-ratio:4/5;overflow:hidden;background:var(--surface-2)}
.card-cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card-cover .grad{position:absolute;inset:0}
.card-cover .pending{
  position:absolute;bottom:10px;left:10px;background:rgba(0,0,0,.55);
  font-size:8.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  padding:4px 8px;color:var(--muted);border:1px solid var(--line);
}
.card-body{padding:16px 16px 18px}
.card-name{font-size:19px;font-weight:700;letter-spacing:-.01em;text-transform:uppercase;margin:0 0 6px}
.card-meta{font-size:10.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
</style>

<div class="topbar">
  <h1>Nancy Offline Events</h1>
  <p>Reference and run-of-show for the crew, one event per card. Tap in for hero, quick links, shot list, moodboard and deliverables.</p>
</div>

<div class="grid" id="grid"></div>

<script>
function driveThumb(id, w){ return `https://drive.google.com/thumbnail?id=${id}&sz=w${w||500}`; }
function grad(seed){
  const p = [["#2E5C63","#7E4426"],["#3B6B5A","#141B1E"],["#7A4B2E","#231A14"],
             ["#4E6E44","#161C16"],["#5C3F62","#1B1520"],["#33587A","#141920"]][seed % 6];
  return `linear-gradient(${(seed*41)%180}deg, ${p[0]}, ${p[1]})`;
}

/* One card per event page. Cover is a real Drive thumbnail where real
   footage exists; an honest placeholder gradient (labelled) where it
   doesn't yet -- no invented cover art. */
const EVENTS = [
  {
    name:"US Open", href:"us-open.html", meta:"New York · 24 Aug – 7 Sept",
    coverThumbId:"1spQ08WH3baEC3HpQZv-bxqpaJkBUtpoo", seed:2
  },
  {
    name:"Cancun Shot", href:"cancun.html", meta:"Lem Island · Sep 7 – 12",
    coverThumbId:"1ulA3r1Uj0ySGcDAGG0xf19OLwqaqx-Bj", seed:0
  }
];

document.getElementById("grid").innerHTML = EVENTS.map(e => `
  <a class="card" href="${e.href}">
    <div class="card-cover">
      ${e.coverThumbId
        ? `<img src="${driveThumb(e.coverThumbId,600)}" alt="${e.name}">`
        : `<span class="grad" style="background:${grad(e.seed)}"></span><span class="pending">Cover pending — no footage yet</span>`}
    </div>
    <div class="card-body">
      <h2 class="card-name">${e.name}</h2>
      <div class="card-meta">${e.meta}</div>
    </div>
  </a>
`).join("");
</script>
