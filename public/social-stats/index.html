<!DOCTYPE html>
<html lang="en">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Social Stats</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Instrument+Serif:ital@0;1&display=swap">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23FF4F8B'/><path d='M8 22V14M14 22V9M20 22v-6M26 22V12' stroke='white' stroke-width='3' stroke-linecap='round'/></svg>">
<style>
:root{
  --bg:#FBF7F2; --paper:#FFFFFF; --ink:#140D11; --muted:#6E6168; --dim:#A3969C;
  --line:#EAE1DA; --line-2:#F3ECE6; --pink:#FF4F8B; --pink-soft:#FFE3EE;
  --good:#11734b; --good-bg:#DDF3E8; --warn:#8A5A00; --warn-bg:#FFF1CC; --bad:#b10202; --bad-bg:#ffcfc9;
  --head:#140D11; --tint:#F7F1EC; --pad:16px;
  --serif:'Instrument Serif',Georgia,serif;
}
@media (min-width:900px){:root{--pad:36px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:'Archivo',system-ui,sans-serif;font-size:14px;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
.serif{font-family:var(--serif);font-style:italic;font-weight:400;letter-spacing:0;text-transform:none}

/* header */
.top{position:sticky;top:0;z-index:20;background:rgba(251,247,242,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top-in{max-width:1440px;margin:0 auto;padding:12px var(--pad);display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:baseline;gap:7px;text-decoration:none}
.brand b{font-size:19px;font-weight:900;letter-spacing:-.02em;text-transform:uppercase}
.brand span{font-family:var(--serif);font-style:italic;font-size:21px;color:var(--pink)}
.nav{display:flex;gap:2px;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none}
.nav a{padding:7px 13px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.03em;text-decoration:none;color:var(--muted);white-space:nowrap}
.nav a:hover{color:var(--ink)}
.nav a.on{background:var(--ink);color:#fff}
.sync{margin-left:auto;display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--muted);background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.sync i{width:7px;height:7px;border-radius:50%;background:var(--dim)}
.sync[data-s=ok] i,.sync[data-s=sheets] i{background:#2BB673}.sync[data-s=saving] i{background:#F5A623}.sync[data-s=error] i{background:var(--bad)}
@media (max-width:640px){.nav{order:3;width:100%}}

main{max-width:1440px;margin:0 auto;padding:26px var(--pad) 120px}
h1{font-size:clamp(28px,4vw,46px);font-weight:900;letter-spacing:-.035em;text-transform:uppercase;line-height:.95;margin:0}
h1 .serif{color:var(--pink);font-size:1.1em}
h2{font-size:13px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;margin:0 0 12px;display:flex;align-items:center;gap:10px}
h2::after{content:"";flex:1;height:1px;background:var(--line)}
h3{font-size:15px;font-weight:800;margin:0 0 8px}
.sub{color:var(--muted);font-size:13px;line-height:1.5;margin:6px 0 0}
.sec{margin-top:34px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grow{flex:1}
.muted{color:var(--muted)}.dim{color:var(--dim)}
.small{font-size:12px}

.btn{display:inline-flex;align-items:center;gap:6px;background:var(--ink);color:#fff;border:0;border-radius:999px;padding:9px 16px;font-size:12px;font-weight:800;letter-spacing:.03em;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn.pink{background:var(--pink)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.sm{padding:6px 11px;font-size:11px}
.btn.danger{background:var(--paper);color:var(--bad);border:1px solid var(--bad-bg)}
.btn:hover{filter:brightness(1.06)}
.btn:disabled{opacity:.4;cursor:default}
.x{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px;line-height:1;padding:2px 6px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--bad-bg)}

.card{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:18px}
.grid{display:grid;gap:14px}
@media (min-width:900px){.g2{grid-template-columns:1fr 1fr}.g3{grid-template-columns:repeat(3,1fr)}}

input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px;min-width:0}
textarea{width:100%;min-height:120px;font-family:ui-monospace,Menlo,monospace;font-size:12px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid var(--pink-soft);border-color:var(--pink)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
label.f input,label.f select{text-transform:none;letter-spacing:0;font-weight:500;color:var(--ink)}
.fields{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}

/* tiles */
.tiles{display:grid;gap:10px;grid-template-columns:repeat(2,1fr)}
@media (min-width:760px){.tiles{grid-template-columns:repeat(3,1fr)}}
@media (min-width:1200px){.tiles{grid-template-columns:repeat(6,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.tile .k{font-size:10.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.tile .v{font-size:26px;font-weight:900;letter-spacing:-.03em;margin-top:6px;line-height:1}
.tile .s{font-size:11.5px;color:var(--muted);margin-top:6px}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--paper)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:top}
th{font-size:10.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--tint);position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.total td{font-weight:800;background:var(--tint);border-top:2px solid var(--ink)}
tr.extra td{background:var(--ev2,#f6f1ec)}
tr.adrow td{color:var(--muted);font-style:italic}
tr.adrow td.n{font-style:normal}
td.cap{max-width:260px;overflow:hidden;text-overflow:ellipsis}
td.wrap{white-space:normal;min-width:220px}
.evhead th{background:var(--ev,var(--tint));color:var(--ink)}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:800}
.chip.yes{background:#11734b;color:#fff}
.chip.no{background:#ffcfc9;color:#b10202}
.chip.k{background:var(--tint);color:var(--muted);font-weight:700}
.chip.collab{background:#EDE4FF;color:#5B34C9}
.chip.nancy{background:var(--pink-soft);color:#C2185B}
.miss{color:var(--bad);font-weight:700;font-size:12px;white-space:normal}
.up{color:var(--good)}.down{color:var(--bad)}
.bench-good{color:var(--good);font-weight:700}.bench-bad{color:var(--bad);font-weight:700}
.tbl-tools{display:flex;justify-content:flex-end;gap:6px;margin:-4px 0 8px}

/* flags */
.flags{display:grid;gap:6px}
.flag{display:flex;gap:10px;align-items:flex-start;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.45}
.flag.bad{background:var(--bad-bg);color:#7a0000}
.flag.warn{background:var(--warn-bg);color:var(--warn)}
.flag.info{background:var(--tint);color:var(--muted)}
.flag b{flex:none;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;margin-top:2px}

/* report list */
.rcards{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(280px,1fr))}
.rcard{display:block;text-decoration:none;background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:16px;position:relative;overflow:hidden}
.rcard:hover{border-color:var(--ink)}
.rcard .band{position:absolute;inset:0 0 auto 0;height:6px;background:var(--ev,var(--pink))}
.rcard .t{font-size:17px;font-weight:900;letter-spacing:-.02em;margin-top:4px}
.rcard .d{font-size:12px;color:var(--muted);margin-top:3px}
.rcard .m{display:grid;grid-template-columns:repeat(4,auto);justify-content:space-between;gap:10px;margin-top:12px}
.rcard .m div{font-size:11px;color:var(--muted)}
.rcard .m b{display:block;font-size:16px;color:var(--ink);font-weight:800}

/* report page */
.rhead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap;padding-bottom:16px;border-bottom:4px solid var(--ev,var(--ink))}
.titleline{font-size:12.5px;color:var(--muted);margin-top:10px;font-weight:600}
.subtabs{display:flex;gap:4px;margin:16px 0 0;flex-wrap:wrap}
.subtabs a{padding:8px 14px;border-radius:10px;font-size:12px;font-weight:800;text-decoration:none;color:var(--muted);border:1px solid transparent}
.subtabs a.on{background:var(--paper);border-color:var(--line);color:var(--ink)}
.subtabs a .cnt{display:inline-block;margin-left:5px;background:var(--bad);color:#fff;border-radius:999px;padding:0 6px;font-size:10px}
.step{display:flex;gap:12px;align-items:flex-start}
.step .num{flex:none;width:28px;height:28px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:12px}
.step .num.done{background:#2BB673}
.who{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--pink)}
.result{margin-top:10px;font-size:12.5px;line-height:1.5}
.result.ok{color:var(--good)}
.result.err{color:var(--bad)}
.list{display:grid;gap:6px;margin-top:10px}
.li{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid var(--line-2);border-radius:10px;font-size:12.5px}
.li .grow{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

.rundown{line-height:1.6;font-size:14px;max-width:900px}
.rundown h1,.rundown h2,.rundown h3{text-transform:none;letter-spacing:-.01em;font-size:17px;margin:18px 0 6px;display:block}
.rundown h2::after{display:none}
.rundown table{margin:8px 0;border:1px solid var(--line)}
.rundown td{white-space:normal}
.rundown ul{padding-left:20px;margin:6px 0}

.empty{padding:30px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:18px}
.toast-btn{margin-left:12px;background:var(--pink);color:#fff;border:0;border-radius:999px;padding:4px 12px;font-weight:800;font-size:12px;cursor:pointer}
.selbar{position:sticky;top:64px;z-index:15;display:flex;gap:10px;align-items:center;background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;margin-top:16px;font-weight:700;font-size:13px}
.selbar #selcount{margin-right:auto}
.selbar .btn.ghost{background:transparent;color:#fff;border-color:rgba(255,255,255,.3)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;font-weight:700;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.2)}
details summary{cursor:pointer;font-weight:700;font-size:12.5px}
.kbd{font-family:ui-monospace,Menlo,monospace;font-size:11px;background:var(--tint);padding:1px 6px;border-radius:5px}

/* home + summaries */
:root{--s1:#2a78d6;--s2:#eb6834;--s3:#1baf7a}
.btn.big{padding:13px 22px;font-size:13.5px}
.home-block{background:var(--paper);border:1px solid var(--line);border-top:6px solid var(--ev,var(--pink));border-radius:22px;padding:20px}
.hb-head{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:6px}
.hb-kind{font-size:11px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--pink)}
.hb-name{font-size:24px;font-weight:900;letter-spacing:-.02em;margin:2px 0}
.headline{font-family:var(--serif);font-style:italic;font-size:21px;line-height:1.35;margin:12px 0 16px;max-width:60ch}
.tiles.big{grid-template-columns:repeat(2,1fr)}
@media (min-width:900px){.tiles.big{grid-template-columns:repeat(4,1fr)}}
.tiles.big .v{font-size:32px}
.tile.hero{background:var(--ink);color:#fff;border-color:var(--ink)}
.tile.hero .k,.tile.hero .s{color:rgba(255,255,255,.7)}
.mini{display:flex;flex-wrap:wrap;gap:8px 22px;margin-top:12px;padding:12px 16px;background:var(--tint);border-radius:14px;font-size:12.5px}
.mini span{color:var(--muted);margin-right:6px}
.splitbar{display:flex;gap:2px;height:16px;margin:10px 0 12px}
.splitbar i{border-radius:4px;min-width:4px}
.legend{display:grid;gap:6px;font-size:12.5px}
.legend div{display:grid;grid-template-columns:12px 1fr auto 58px;gap:8px;align-items:center}
.legend .sw{width:10px;height:10px;border-radius:3px}
.legend .muted{text-align:right}
ol.top{margin:0;padding-left:18px;display:grid;gap:9px;font-size:13px}
ol.top li span{display:block;font-size:12px;margin-top:2px}
.vtip{position:fixed;z-index:60;background:var(--ink);color:#fff;font-size:12px;font-weight:600;padding:6px 10px;border-radius:8px;pointer-events:none;max-width:280px}
/* chooser */
.choose{display:grid;gap:14px}
@media (min-width:900px){.choose{grid-template-columns:repeat(3,1fr)}}
.pick{display:flex;flex-direction:column;gap:10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:22px;padding:24px;cursor:pointer;min-height:220px}
.pick:hover{border-color:var(--ink);box-shadow:0 10px 30px rgba(20,13,17,.08)}
.pick .pk{font-size:24px;font-weight:900;letter-spacing:-.02em}
.pick .pd{color:var(--muted);line-height:1.5;font-size:13.5px}
.pick .pw{margin-top:auto;font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--pink)}
/* costing */
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--line);border-radius:20px;padding:36px 16px;background:var(--paper);cursor:pointer;text-align:center}
.drop b{font-size:17px}.drop span{color:var(--muted);font-size:12.5px}
.drop.over,.drop:hover{border-color:var(--pink);background:var(--pink-soft)}
.or{display:flex;align-items:center;gap:10px;margin:18px 0 12px;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.prog{height:6px;background:var(--line-2);border-radius:4px;overflow:hidden;margin-top:12px}
.prog i{display:block;height:100%;width:0;background:var(--pink);transition:width .2s}
tr.seg td{background:var(--tint);font-weight:800;font-size:11.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
input.ed,select.ed{padding:5px 7px;font-size:12.5px;border-radius:8px}
.hbars{display:grid;gap:8px}
.hb{display:grid;grid-template-columns:minmax(110px,170px) 1fr auto;gap:10px;align-items:center;font-size:12.5px}
.hb .ht{height:12px;background:var(--line-2);border-radius:4px;overflow:hidden}
.hb .ht i{display:block;height:100%;background:var(--s1);border-radius:0 4px 4px 0}
.warnc{color:var(--warn)}
.chip.rt-organic{background:var(--good-bg);color:var(--good)}
.chip.rt-boosted{background:var(--pink-soft);color:#C2185B}
.chip.rt-unknown{background:var(--warn-bg);color:var(--warn)}
ol.top li .chip{margin-top:4px}


@media print{
  .top,.subtabs,.tbl-tools,.noprint,.btn{display:none!important}
  body{background:#fff}
  .tw{overflow:visible;border:0}
  th{position:static}
  .sec{break-inside:avoid-page}
}
</style>

<header class="top"><div class="top-in">
  <a class="brand" href="#/"><b>Social</b><span>Stats</span></a>
  <nav class="nav" id="nav">
    <a href="#/" data-r="home">Home</a>
    <a href="#/reports" data-r="reports">Reports</a>
    <a href="#/compare" data-r="compare">Compare</a>
    <a href="#/posts" data-r="posts">Posts</a>
    <a href="#/ads" data-r="ads">Ad exports</a>
    <a href="#/settings" data-r="settings">Settings</a>
  </nav>
  <button class="sync" id="sync" data-s="off" title="Sync status" hidden><i></i><span></span></button>
</div></header>
<main id="app"></main>
<div class="toast" id="toast" hidden></div>

<script type="module">
import * as E from "./engine.js?v=dev";

/* ───────── where the shared data lives ─────────
   Served from Vercel (content-nine-topaz.vercel.app/social-stats) and from GitHub
   Pages. Both sync through the Vercel API. */
const ON_VERCEL = /vercel\.app$/.test(location.hostname);
const LOCAL = /^(localhost|127\.)/.test(location.hostname);
const API = ON_VERCEL ? "/api/stats" : LOCAL ? "/api/stats" : "https://content-nine-topaz.vercel.app/api/stats";

/* ───────── store: one record per key, newest updatedAt wins ───────── */
const LS = "ss.docs";
let docs = {};
try { docs = JSON.parse(localStorage.getItem(LS) || "{}"); } catch { docs = {}; }
const saveLocal = () => { try { localStorage.setItem(LS, JSON.stringify(docs)); } catch { toast("This browser's storage is full — sync still saves to the team copy."); } };

function put(key, value){
  const { updatedAt: _a, ...next } = value || {};
  const { updatedAt: _b, ...prev } = docs[key] || {};
  if (docs[key] && JSON.stringify(next) === JSON.stringify(prev)) return;     // nothing changed: don't save or sync
  docs[key] = { ...next, updatedAt: Date.now() };
  saveLocal();
  sync.queue(key);
}
/* Deleting keeps the record, marked deleted, so it can be restored from Settings › Recently deleted. */
const del = (key, extra = {}) => put(key, { ...(docs[key] || {}), ...extra, deleted: true, deletedAt: Date.now() });
const restore = key => {
  const { deleted, deletedAt, wasFor, ...rest } = docs[key] || {};
  put(key, rest);
  const ev = wasFor && docs["ss.report." + wasFor];                 // a costing report goes back to its event
  if (ev && !ev.deleted && !ev.costingId) put("ss.report." + wasFor, { ...ev, costingId: rest.id });
};

function db(){
  const out = { settings: { ...E.DEFAULT_SETTINGS }, posts: {}, imports: {}, reports: {} };
  const s = docs["ss.settings"];
  if (s && !s.deleted) out.settings = { ...E.DEFAULT_SETTINGS, ...s, fx: { ...E.DEFAULT_SETTINGS.fx, ...(s.fx || {}) }, target: { ...E.DEFAULT_SETTINGS.target, ...(s.target || {}) } };
  for (const [k, v] of Object.entries(docs)) {
    if (!v || v.deleted) continue;
    if (k.startsWith("ss.post.")) out.posts[v.id] = v;
    else if (k.startsWith("ss.import.")) out.imports[v.id] = v;
    else if (k.startsWith("ss.report.")) out.reports[v.id] = v;
  }
  return out;
}
const uid = () => Math.random().toString(36).slice(2, 10);

/* ───────── team sync ───────── */
const sync = {
  state: "off", pending: new Set(), timer: null,
  pass(){ try { return localStorage.getItem("ss.passcode") || ""; } catch { return ""; } },
  show(s){
    sync.state = s;
    const el = document.getElementById("sync");
    el.dataset.s = s;
    // no team store yet, but the reports come from Google Sheets — every browser sees those
    const at = +(localStorage.getItem("ss.sourcesAt") || 0);
    const live = s === "off" && at;
    el.dataset.s = live ? "sheets" : s;
    el.hidden = s === "off";                                     // only shown once team sync exists
    el.querySelector("span").textContent = live
      ? `Live from Google Sheets · ${new Date(at).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}`
      : { off: "Saved in this browser", ok: "Synced with team", saving: "Saving…", error: "Offline — retrying" }[s];
    el.title = live
      ? "Reports are read from the team's Google Sheets every time the page opens, so every browser and device sees them. Click to refresh now. (Invoices and edits made inside the app are saved in this browser until team sync is switched on.)"
      : s === "ok" ? "Everything is shared with the team." : "Click to retry.";
  },
  queue(k){
    sync.pending.add(k);
    try { localStorage.setItem("ss.unsent", JSON.stringify([...sync.pending])); } catch {}
    if (sync.state === "off") return;
    sync.show("saving");
    clearTimeout(sync.timer); sync.timer = setTimeout(sync.flush, 600);
  },
  async flush(){
    if (!sync.pending.size) return;
    const keys = [...sync.pending].slice(0, 40);
    const body = { docs: Object.fromEntries(keys.filter(k => docs[k]).map(k => [k, docs[k]])) };
    try {
      const r = await fetch(API, { method: "POST", headers: { "Content-Type": "application/json", "x-passcode": sync.pass() }, body: JSON.stringify(body) });
      if (r.status === 401) { sync.show("error"); askPass(); return; }
      if (!r.ok) throw new Error(r.status);
      const { stale = {} } = await r.json();
      keys.forEach(k => sync.pending.delete(k));
      try { localStorage.setItem("ss.unsent", JSON.stringify([...sync.pending])); } catch {}
      if (Object.keys(stale).length) {           // someone saved newer versions: take theirs
        Object.assign(docs, stale); saveLocal(); render();
        toast("A teammate saved newer changes — showing theirs.");
      }
      if (sync.pending.size) { sync.timer = setTimeout(sync.flush, 50); } else sync.show("ok");
    } catch {
      sync.show("error");
      clearTimeout(sync.timer); sync.timer = setTimeout(sync.flush, 5000);
    }
  },
  async pull(){
    let remote;
    try {
      const r = await fetch(API, { cache: "no-store" });
      if (r.status === 503 || r.status === 404) { sync.show("off"); return; }
      if (!r.ok) throw new Error(r.status);
      remote = (await r.json()).docs || {};
    } catch { if (sync.state !== "off") sync.show("error"); return; }
    if (sync.state === "off") {
      try { for (const k of JSON.parse(localStorage.getItem("ss.unsent") || "[]")) sync.pending.add(k); } catch {}
    }
    sync.show("ok");
    let changed = false;
    for (const [k, v] of Object.entries(remote)) {
      const mine = docs[k];
      if (!mine || (v.updatedAt || 0) > (mine.updatedAt || 0)) { docs[k] = v; changed = true; sync.pending.delete(k); }
      else if ((mine.updatedAt || 0) > (v.updatedAt || 0)) sync.pending.add(k);
    }
    for (const k of Object.keys(docs)) if (!(k in remote)) sync.pending.add(k);   // records only made here
    if (changed) { saveLocal(); render(); }
    if (sync.pending.size) { sync.show("saving"); sync.flush(); }
  },
};

/* ───────── PDF to send ─────────
   A real document (selectable text, proper tables, page numbers) built by pdf.js with jsPDF.
   summary = founder version (portrait) · full = every table (landscape) · costing = costing report.
   Desktop: downloads the file. Phones: opens the share sheet (WhatsApp, Mail, Slack…). */
let pdfBusy = false;
async function exportPDF(id, mode){
  if (pdfBusy) return;
  const D = db(), rep = D.reports[id];
  if (!rep) return;
  pdfBusy = true;
  toast("Making the PDF…");
  try {
    await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js", "jspdf");
    if (!window.jspdf.jsPDF.API.autoTable) await new Promise((ok, no) => {
      const sc = document.createElement("script"); sc.src = "https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js";
      sc.onload = ok; sc.onerror = () => no(new Error("Couldn't load the PDF tables")); document.head.append(sc);
    });
    const { buildPdf } = await import("./pdf.js?v=dev");
    let args;
    if (rep.type === "costing") args = { rep, CR: E.buildCosting(rep, D, D.settings), mode };
    else {
      const R = E.buildReport(rep, D, D.settings);
      const pr = prevFor(rep, D);
      args = { rep, R, P: pr ? E.buildReport(pr, D, D.settings) : null, mode, settings: D.settings };
    }
    const doc = buildPdf(args);
    const kind = rep.type === "week" ? "Weekly social report" : rep.type === "costing" ? "Costing report" : "Event report";
    const name = rep.type === "costing" ? (rep.eventName || rep.name) : rep.name;
    const file = `${kind} - ${(name || "report").replace(/[\\/:*?"<>|]+/g, "-")}${mode === "full" ? " (full)" : ""}.pdf`;
    const pdf = new File([doc.output("blob")], file, { type: "application/pdf" });
    if (matchMedia("(pointer: coarse)").matches && navigator.canShare?.({ files: [pdf] })) {
      await navigator.share({ files: [pdf], title: `${kind}: ${name}` }).catch(() => {});
    } else {
      const a = document.createElement("a"); a.href = URL.createObjectURL(pdf); a.download = file; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 10000);
      toast("PDF downloaded");
    }
  } catch (e) {
    console.error(e); toast("Couldn't make the PDF — try again");
  } finally { pdfBusy = false; }
}
document.addEventListener("click", e => {
  const b = e.target.closest("[data-pdf]");
  if (b) { e.preventDefault(); exportPDF(b.dataset.pdfId, b.dataset.pdf); }
});

function deleteReport(rep){
  const D = db();

  if (!confirm(`Delete ${label}?\n\nYou can restore it later from Settings › Recently deleted.`)) return;
  let wasFor = null;
  if (rep.type === "costing") {                                   // unlink it from its event (relinked on restore)
    const ev = Object.values(D.reports).find(r => r.costingId === rep.id);

}

  if (type === "week") {
    const d = new Date(t + "T12:00:00Z");
    const back = d.getUTCDay() + 7;                             // weeks run Sunday–Saturday: Sunday of last week
    const start = E.addDays(t, -back), end = E.addDays(start, 6);
    rep = { id, type, name: `Week of ${F.date(start)}`, start, end, dataDate: t, importIds: [], account: {}, otherSpend: [], colour: "" };
  } else {
    rep = { id, type, name: "New event", start: t, end: t, dataDate: t, postIds: [], importIds: [], influencers: [], eventCosts: [], colour: "Pink", fresh: true };
  }
  rep.fx = { ...db().settings.fx };
  put("ss.report." + id, rep);
  location.hash = `#/r/${id}/data`;
}

/* A costing report for an event name: links to the event report of the same name when there is one. */
function startCosting(eventName){
  const D = db();
  const ev = Object.values(D.reports).find(r => r.type === "event" && r.name.trim().toLowerCase() === eventName.toLowerCase());
  if (ev?.costingId && D.reports[ev.costingId]) return ev.costingId;               // that event already has one: open it
  const id = newCosting({ name: eventName, eventName, start: ev?.start || today(), end: ev?.end || today(), colour: ev?.colour
    || Object.keys(E.EVENT_COLOURS).find(k => eventName.toLowerCase().includes(k.toLowerCase())) || "Pink" });
  if (ev) put("ss.report." + ev.id, { ...ev, costingId: id });
  return id;
}

function newCosting(fields){
  const id = uid(), t = today();
  put("ss.report." + id, { id, type: "costing", name: "New costing", start: t, end: t, colour: "Pink", influencers: [], eventCosts: [],
    fx: { ...db().settings.fx }, fresh: !fields.name, ...fields });
  return id;
}

/* ───────── a report ───────── */
function prevFor(rep, D){
  if (rep.type === "week") {
    const p = rep.prevId ? D.reports[rep.prevId] : E.previousWeek(rep, D.reports);
    return p || null;
  }
  return rep.compareId ? D.reports[rep.compareId] || null : E.previousEvent(rep, D.reports);
}

function renderReport(D, id, tab, q){
  const rep = D.reports[id];
  if (!rep) { app.innerHTML = `<div class="empty">This report doesn't exist (or was deleted). <a href="#/">Back to reports</a></div>`; return; }
  const R = E.buildReport(rep, D, D.settings);
  const prev = prevFor(rep, D);
  const P = prev ? E.buildReport(prev, D, D.settings) : null;
  if (P && rep.type === "week" && P.dataDate && R.dataDate && P.dataDate !== R.dataDate) {
    const ageA = E.daysBetween(rep.end, R.dataDate), ageB = E.daysBetween(prev.end, P.dataDate);
    R.flags.push({ level: "info", text: `Last week was pulled ${F.date(P.dataDate)} (${ageB} days after its week), this week ${F.date(R.dataDate)} (${ageA} days after). Posts with more days live usually have more views — compare with that in mind.` });
  }
  const [c1, c2] = evColours(rep);
  document.documentElement.style.setProperty("--ev", c1);
  document.documentElement.style.setProperty("--ev2", c2);
  const nFix = R.flags.filter(f => f.level !== "info").length;
  const T = R.T;
  const title = rep.type === "week"
    ? `Weekly Social Report · ${F.date(rep.start)}–${F.dateY(rep.end)} · ${D.settings.account} · ${T.posts} posts · Instagram data pulled ${F.dateY(R.dataDate)}`
    : `${esc(rep.name)} · ${F.date(rep.start)}–${F.dateY(rep.end)} · ${R.durationDays} day${R.durationDays === 1 ? "" : "s"} · ${T.posts} event posts (${T.nancyPosts} Nancy, ${T.collabPosts} collab)${T.extra ? ` + ${T.extra} extra` : ""} · data pulled ${F.dateY(R.dataDate)}`;
  const tabs = [["summary", "Summary"], ["full", "Full report"], ["data", "Add data"], ["match", "Ad matching"], ["checks", `Checks${nFix ? `<span class="cnt">${nFix}</span>` : ""}`]];
  app.innerHTML = `
    <div class="rhead" style="--ev:${c1}">
      <div class="grow">
        <div class="small muted"><a href="#/reports">Reports</a> / ${rep.type === "week" ? "Weekly" : "Event"}</div>
        <h1 style="margin-top:6px">${esc(rep.name || "Untitled")}</h1>
        <div class="titleline">${title}</div>
      </div>
      <div class="row noprint">
        <button class="btn ghost sm" id="csv">Download CSV</button>
        <button class="btn ghost sm" data-pdf="summary" data-pdf-id="${id}">⬇ PDF · Summary</button>
        <button class="btn ghost sm" data-pdf="full" data-pdf-id="${id}">⬇ PDF · Full report</button>
        <button class="btn ghost sm" id="share">Copy link</button>
        <button class="btn danger sm" id="hdr-del">Delete report</button>
      </div>
    </div>
    <nav class="subtabs">${tabs.map(([k, l]) => `<a href="#/r/${id}/${k}" class="${tab === k ? "on" : ""}">${l}</a>`).join("")}</nav>
    <div id="body"></div>`;
  document.getElementById("hdr-del").onclick = () => deleteReport(rep);
  document.getElementById("share").onclick = () => copy(location.href.replace(/#.*/, "") + `#/r/${id}`, "Link copied");
  document.getElementById("csv").onclick = () => downloadCSV(rep);
  const body = document.getElementById("body");
  if (tab === "data") return renderData(body, rep, R, D);
  if (tab === "match") return renderMatch(body, rep, R, D);
  if (tab === "checks") return renderChecks(body, R);
  if (tab === "summary") { body.innerHTML = `<div class="sec">${rep.type === "week" ? weeklySummaryHTML(rep, R, P, D) : eventSummaryHTML(rep, R, P, D)}</div><div class="sec row noprint"><a class="btn" href="#/r/${id}/full">View full report →</a></div>`; return; }
  body.innerHTML = rep.type === "week" ? weeklyHTML(rep, R, P, D) : eventHTML(rep, R, P, D);
  wireReport(body, rep, R, P, D);
}

function flagsHTML(R, limit){
  const order = { bad: 0, warn: 1, info: 2 };
  const list = [...R.flags].sort((a, b) => order[a.level] - order[b.level]);
  const shown = limit ? list.filter(f => f.level !== "info").slice(0, limit) : list;
  if (!shown.length) return limit ? "" : `<div class="flag info"><b>OK</b>Every check passed.</div>`;
  const lab = { bad: "Fix", warn: "Check", info: "Note" };
  return `<div class="flags">${shown.map(f => `<div class="flag ${f.level}"><b>${lab[f.level]}</b><span>${esc(f.text)}</span></div>`).join("")}
    ${limit && list.length > shown.length ? `<a class="small muted" href="#/r/${R.rep.id}/checks">See all ${list.length} checks →</a>` : ""}</div>`;
}
function renderChecks(body, R){
  const missing = Object.values(R.missing);
  body.innerHTML = `<div class="sec"><h2>Checks before reporting</h2>${flagsHTML(R)}</div>
    ${missing.length ? `<div class="sec"><h2>Missing data</h2><div class="flags">${missing.map(m => `<div class="flag warn"><b>Need</b><span>${esc(m.need)} — from ${esc(m.who)}</span></div>`).join("")}</div></div>` : ""}
    <div class="sec"><h2>What's checked</h2><p class="sub">Total = organic + paid on every row · no negative organic views · no post twice in a report or across events · spend in the rows equals spend in the exports (after FX) · every export has a Views column and covers the date range · every post has views and one pull date · ads matched by name, separate ad versions and unmatched ads are flagged · ads CPM within $${D0().settings.cpmRange[0]}–$${D0().settings.cpmRange[1]} · Organic CPM left blank without event cost · influencer and event costs kept separate.</p></div>`;
}
const D0 = () => db();

function tbl(id, head, rows, opts = {}){
  return `<div class="tbl-tools noprint"><button class="btn ghost sm" data-copy="${id}">Copy for Sheets</button></div>
  <div class="tw"><table id="${id}"${opts.ev ? ' class="ev"' : ""}><thead><tr class="${opts.ev ? "evhead" : ""}">${head.map(h => `<th class="${h.n ? "n" : ""}">${h.t ?? h}</th>`).join("")}</tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}
const N = t => ({ t, n: true });

/* weekly per-post table (§3.4) */

}

function cmpCell(c){
  if (!c || c.prev == null) return "—";
  const f = v => c.rate ? F.pct(v) : c.money ? F.usd(v) : F.int(v);
  return `${f(c.prev)} · <span class="${c.status === "🟢" ? "up" : c.status === "🔴" ? "down" : ""}">${c.rate ? F.pp(c.change) : F.chg(c.change)}</span>`;
}
function cmpTable(id, A, B, labelA, labelB){
  const rows = E.compareReports(A, B).map(c => {
    const f = v => v == null ? "—" : c.rate ? F.pct(v) : c.money ? F.usd(v) : F.int(v);
    return `<tr><td>${esc(c.name)}</td><td class="n">${f(c.cur)}</td><td class="n">${f(c.prev)}</td><td class="n">${c.change == null ? "—" : c.rate ? F.pp(c.change) : F.chg(c.change)}</td><td>${c.status || "—"}</td></tr>`;
  });
  return tbl(id, ["Metric", N(esc(labelA)), N(esc(labelB)), N("Change"), "Status"], rows);
}

function tiles(list){
  return `<div class="tiles">${list.map(([k, v, s]) => `<div class="tile"><div class="k">${k}</div><div class="v">${v}</div>${s ? `<div class="s">${s}</div>` : ""}</div>`).join("")}</div>`;
}

function rankHTML(R){

function breakdownTable(id, groups, bench){

function campaignTable(R){
  if (!R.campaigns.length) return `<p>${miss(R.missing.ads || { need: "ad exports", who: "Ads person" })}</p>`;
  const rows = R.campaigns.map(c => `<tr><td>${esc(c.campaign)}</td><td class="n">${c.mixedCur ? "mixed" : `${esc(c.currency)} ${c.spend.toLocaleString("en-US", { maximumFractionDigits: 2 })}`}</td><td class="n">${F.usd(c.usd)}</td><td class="n">${F.int(c.views)}</td><td class="n">${F.int(c.reach)}</td><td class="n">${F.usd(c.cpm)}</td><td class="n">${F.pct(c.pctPaid)}</td><td class="n">${c.follows == null ? miss(R.missing.adFollows) : F.int(c.follows)}</td><td class="n">${c.cpf == null ? "—" : F.usd(c.cpf)}</td></tr>`);
  rows.push(`<tr class="total"><td>Total</td><td></td><td class="n">${F.usd(R.T.adSpend)}</td><td class="n">${F.int(R.T.paidViews)}</td><td class="n">${F.int(R.campaigns.reduce((s, c) => s + c.reach, 0))}</td><td class="n">${F.usd(R.T.adsCPM)}</td><td class="n">100%</td><td class="n">${F.int(R.T.adFollows)}</td><td class="n">${F.usd(R.T.costPerFollow)}</td></tr>`);
  return tbl("t-camp", ["Campaign", N("Spend (original)"), N("Spend (USD)"), N("Views"), N("Reach*"), N("CPM"), N("% of paid views"), N("Follows"), N("Cost / follow")], rows)
    + `<p class="small dim">*Reach is summed across ads, so people reached by two ads are counted twice.</p>`;
}

function wireReport(body, rep, R, P, D){
  body.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(tableTSV(document.getElementById(b.dataset.copy)), "Table copied — paste into Sheets"));
  const pr = body.querySelector("#prompt");
  if (pr) pr.onclick = () => copy(E.rundownPrompt(R, P), "Prompt copied — paste it into Claude");
  const er = body.querySelector("#editRun");
  if (er) er.onclick = () => { body.querySelector("#runEdit").hidden = false; body.querySelector("#runText").focus(); };
  const rs = body.querySelector("#runSave");
  if (rs) rs.onclick = () => { put("ss.report." + rep.id, { ...rep, rundown: body.querySelector("#runText").value }); render(); toast("Rundown saved"); };
  const pp = body.querySelector("#prevPick");
  if (pp) pp.onchange = () => { put("ss.report." + rep.id, { ...rep, prevId: pp.value || null }); render(); };
  const cp = body.querySelector("#cmpPick");
  if (cp) cp.onchange = () => { put("ss.report." + rep.id, { ...rep, compareId: cp.value || null }); render(); };
}

function downloadCSV(rep){
  const tables = [...document.querySelectorAll("#body table")];
  if (!tables.length || route().parts[2] !== "full") { location.hash = `#/r/${rep.id}/full`; setTimeout(() => downloadCSV(rep), 100); return; }
  const parts = tables.map(t => {
    const h = t.closest(".sec")?.querySelector("h2")?.innerText || "";
    return [h, ...[...t.rows].map(tr => [...tr.cells].map(c => csvCell(c.innerText.replace(/\s+/g, " ").trim())).join(","))].join("\n");
  });
  const blob = new Blob([parts.join("\n\n")], { type: "text/csv" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = `${(rep.name || "report").replace(/[^\w]+/g, "-")}-${rep.dataDate || ""}.csv`;
  a.click();
}

/* tiny Markdown for the rundown */
function md(src){
  const lines = String(src).replace(/\r/g, "").split("\n");
  let out = "", inList = false, tbl = [];
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/\*(.+?)\*/g, "<i>$1</i>");
  const flushT = () => {
    if (!tbl.length) return;
    const rows = tbl.filter(l => !/^\s*\|?\s*:?-{2,}/.test(l)).map(l => l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()));
    out += `<div class="tw"><table><thead><tr>${rows[0].map(c => `<th>${inline(c)}</th>`).join("")}</tr></thead><tbody>${rows.slice(1).map(r => `<tr>${r.map(c => `<td>${inline(c)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`;
    tbl = [];
  };
  for (const l of lines) {
    if (/^\s*\|/.test(l)) { if (inList) { out += "</ul>"; inList = false; } tbl.push(l); continue; }
    flushT();
    const h = l.match(/^(#{1,3})\s+(.*)/);
    if (h) { if (inList) { out += "</ul>"; inList = false; } out += `<h3>${inline(h[2])}</h3>`; continue; }
    const li = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/);
    if (li) { if (!inList) { out += "<ul>"; inList = true; } out += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { out += "</ul>"; inList = false; }
    if (l.trim()) out += `<p>${inline(l)}</p>`;
  }
  flushT(); if (inList) out += "</ul>";
  return out;
}

/* ───────── founder summaries: the few numbers that matter ───────── */

/* Part-to-whole bar: fixed series order, 2px gaps, labels with values beside it (never colour alone). */
const SERIES = ["var(--s1)", "var(--s2)", "var(--s3)"];
function splitBar(parts, fmt){
  const shown = parts.filter(p => p.value != null);
  const total = shown.reduce((s, p) => s + (p.value || 0), 0);
  if (!total) return `<p class="small muted">No numbers yet.</p>`;
  return `<div class="splitbar">${parts.map((p, i) => p.value ? `<i style="flex:${p.value};background:${SERIES[i]}" data-tip="${esc(p.label)}: ${esc(fmt(p.value))} (${F.pct(p.value / total)})"></i>` : "").join("")}</div>
    <div class="legend">${parts.map((p, i) => `<div><span class="sw" style="background:${SERIES[i]}"></span><span class="lk">${esc(p.label)}</span><b>${p.value == null ? `<span class="miss">${esc(p.missing || "missing")}</span>` : esc(fmt(p.value))}</b><span class="muted">${p.value == null ? "" : F.pct(p.value / total)}</span></div>`).join("")}</div>`;
}

/* The rundown's headline, if Claude's rundown has been pasted in. */
function rundownHeadline(md){
  if (!md) return "";
  const lines = md.split("\n").map(l => l.trim());
  const h = lines.findIndex(l => /^#+\s*headline/i.test(l));
  const pick = (h >= 0 ? lines.slice(h + 1) : lines).find(l => l && !/^#|^\||^[-*]\s*$/.test(l));
  return (pick || "").replace(/^[-*]\s+/, "").replace(/\*\*/g, "");
}

function miniCmp(R, P, names){
  if (!P) return "";
  const all = Object.fromEntries(E.compareReports(R, P).map(c => [c.name, c]));
  const rows = names.map(n => all[n]).filter(Boolean).map(c => {
    const f = v => v == null ? "—" : c.rate ? F.pct(v) : c.money ? F.usd(v) : F.int(v);
    return `<tr><td>${esc(c.name)}</td><td class="n">${f(c.cur)}</td><td class="n">${f(c.prev)}</td><td class="n">${c.change == null ? "—" : `${c.status} ${c.rate ? F.pp(c.change) : F.chg(c.change)}`}</td></tr>`;
  });
  return `<div class="tw"><table><thead><tr><th></th><th class="n">This</th><th class="n">${esc(P.rep.name)}</th><th class="n">Change</th></tr></thead><tbody>${rows.join("")}</tbody></table></div>`;
}

      <div><span>Ad spend</span><b>${F.usd(T.adSpend)}</b></div>

    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>Where the views came from</h3>${splitBar([
        { label: "Organic", value: T.organicViews },

      <div class="card"><h3>Nancy vs collab</h3>${splitBar([

        { label: "Collab posts", value: R.breakdown[1].views },

    </div>
    <div class="grid g2" style="margin-top:14px">
      <div class="card"><h3>Top 3 by views</h3>${topPosts(R, "views")}</div>
      <div class="card"><h3>Top 3 by eng. rate</h3>${topPosts(R, "er")}</div>
    </div>
    <div class="card" style="margin-top:14px"><h3>Against the week before</h3>${P ? miniCmp(R, P, ["Account views", "Post views", "Eng. rate (per view)", "Blended CPM", "Ad spend (USD)", "Follows (from posts)"]) : `<p class="small muted">Shows once there's last week's report.</p>`}</div>
    ${issuesLine(rep, R)}`;
}

/* hover tooltip for any [data-tip] mark */
(() => {
  const tip = document.createElement("div");
  tip.className = "vtip"; tip.hidden = true; document.body.append(tip);
  document.addEventListener("mouseover", e => { const t = e.target.closest("[data-tip]"); if (!t) { tip.hidden = true; return; } tip.textContent = t.dataset.tip; tip.hidden = false; });
  document.addEventListener("mousemove", e => { if (!tip.hidden) { tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = e.clientY + 14 + "px"; } });
})();

/* ───────── costing reports ───────── */
const QUEUE = new Map();                           // costing id -> invoices read, waiting for review

function renderCosting(D, rep, tab){
  const CR = E.buildCosting(rep, D, D.settings);
  const eventName = rep.eventName || CR.event?.name || (rep.name && rep.name !== "New costing" ? rep.name.replace(/\s+costs$/i, "") : "");
  const [c1, c2] = evColours(rep);
  document.documentElement.style.setProperty("--ev", c1);
  document.documentElement.style.setProperty("--ev2", c2);
  const waiting = (QUEUE.get(rep.id) || []).length;
  const tabs = [["summary", "Summary"], ["costs", "Costs"], ["add", `Add invoices${waiting ? `<span class="cnt">${waiting}</span>` : ""}`]];
  app.innerHTML = `
    <div class="rhead" style="--ev:${c1}">
      <div class="grow">
        <div class="small muted"><a href="#/reports">Reports</a> / Costing</div>
        <h1 style="margin-top:6px">${esc(eventName || "Untitled event")}</h1>
        <div class="titleline">Costing report · ${F.date(rep.start)}–${F.dateY(rep.end)} · ${CR.T.lines} lines${CR.event ? ` · for <a href="#/r/${CR.event.id}">${esc(CR.event.name)}</a>` : ""}</div>
      </div>
      <div class="row noprint">
        <button class="btn ghost sm" id="k-csv">Export CSV</button>
        <button class="btn ghost sm" id="k-tsv">Copy for Sheets</button>
        <button class="btn ghost sm" data-pdf="costing" data-pdf-id="${rep.id}">⬇ PDF</button>
        <button class="btn danger sm" id="hdr-del">Delete report</button>
      </div>
    </div>
    <nav class="subtabs">${tabs.map(([k, l]) => `<a href="#/r/${rep.id}/${k}" class="${tab === k ? "on" : ""}">${l}</a>`).join("")}</nav>
    <div id="body"></div>`;
  document.getElementById("k-csv").onclick = () => {
    const blob = new Blob([costingRows(CR).map(r => r.map(c => csvCell(String(c ?? ""))).join(",")).join("\n")], { type: "text/csv" });
    const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = `${(rep.name || "costing").replace(/[^\w]+/g, "-")}.csv`; a.click();
  };
  document.getElementById("hdr-del").onclick = () => deleteReport(rep);
  document.getElementById("k-tsv").onclick = () => copy(costingRows(CR).map(r => r.join("\t")).join("\n"), "Costs copied — paste into Sheets");
  const body = document.getElementById("body");
  if (!eventName) {                                            // nothing else until it has an event
    body.innerHTML = `<div class="sec card"><h3>Which event is this costing for?</h3>
      <div class="row" style="margin-top:10px"><input type="text" id="k-evname" class="grow" list="ev-names2" placeholder="Event name">
      <datalist id="ev-names2">${Object.values(D.reports).filter(r => r.type === "event").map(e => `<option value="${esc(e.name)}">`).join("")}</datalist>
      <button class="btn pink" id="k-evgo">Save</button></div></div>`;
    document.getElementById("k-evgo").onclick = () => {
      const v = document.getElementById("k-evname").value.trim();
      if (!v) return toast("Type the event name");
      const ev = Object.values(db().reports).find(r => r.type === "event" && r.name.trim().toLowerCase() === v.toLowerCase() && !r.costingId);
      put("ss.report." + rep.id, { ...db().reports[rep.id], name: v, eventName: v, fresh: false });
      if (ev) put("ss.report." + ev.id, { ...ev, costingId: rep.id });
      render();
    };
    return;
  }
  if (tab === "costs") return costingLines(body, rep, CR, D);
  if (tab === "add") return costingAdd(body, rep, CR);
  costingSummary(body, rep, CR);
}

function costingRows(CR){
  const out = [["List", "Category", "Payee / creator", "Item / deliverables", "Date", "Qty", "Amount", "Currency", "USD", "Invoice #", "Receipt", "Source"]];
  for (const l of CR.influencers) out.push(["Influencer", "", l.creator, l.deliverables, l.date || "", "", l.fee, l.currency, l.usd == null ? "" : l.usd.toFixed(2), l.invoiceNo || "", l.receipt || "", l.source || ""]);
  for (const l of CR.eventCosts) out.push(["Event cost", l.category, l.vendor, l.item, l.date || "", l.qty ?? "", l.unit, l.currency, l.usd == null ? "" : l.usd.toFixed(2), l.invoiceNo || "", l.receipt || "", l.source || ""]);
  out.push(["Total", "", "", "", "", "", "", "", CR.T.total.toFixed(2), "", "", ""]);
  return out;
}

function costingSummary(body, rep, CR){
  const T = CR.T, Ev = CR.E;
  const max = Math.max(T.influencerCost, ...CR.byCategory.map(c => c.usd), 1);
  const bars = [{ category: "Influencers & models", usd: T.influencerCost, lines: CR.influencers.length }, ...CR.byCategory].filter(c => c.lines).sort((a, b) => b.usd - a.usd);
  body.innerHTML = `
    ${CR.flags.length ? `<div class="sec">${flagsHTML({ flags: CR.flags, rep }, 0)}</div>` : ""}
    <div class="sec"><div class="tiles big">
      <div class="tile hero"><div class="k">Total cost</div><div class="v">${F.usd(T.total)}</div><div class="s">${T.lines} lines · excludes ads</div></div>
      <div class="tile"><div class="k">Influencers &amp; models</div><div class="v">${F.usd(T.influencerCost)}</div><div class="s">${T.creators} ${T.creators === 1 ? "person" : "people"}</div></div>
      <div class="tile"><div class="k">Event costs</div><div class="v">${F.usd(T.eventCost)}</div><div class="s">${CR.eventCosts.length} lines</div></div>
      <div class="tile"><div class="k">${Ev ? "Blended CPM" : "Event"}</div><div class="v">${Ev ? F.usd(Ev.T.blendedCPM) : "—"}</div><div class="s">${Ev ? `with ${F.usd(Ev.T.adSpend)} ads · ${F.big(Ev.T.totalViews)} views` : "link an event report to see CPM"}</div></div>
    </div></div>
    <div class="sec grid g2">
      <div class="card"><h3>Where the money went</h3>
        ${bars.length ? `<div class="hbars">${bars.map(c => `<div class="hb" data-tip="${esc(c.category)}: ${F.usd(c.usd)} · ${c.lines} line${c.lines > 1 ? "s" : ""}"><span class="hl">${esc(c.category)}</span><span class="ht"><i style="width:${(c.usd / max) * 100}%"></i></span><b>${F.usd(c.usd)}</b></div>`).join("")}</div>` : `<p class="small muted">No costs yet — <a href="#/r/${rep.id}/add">add invoices</a>.</p>`}
      </div>
      <div class="card"><h3>Influencers &amp; models</h3>
        ${CR.byCreator.length ? `<div class="tw"><table><thead><tr><th>Creator</th><th>Deliverables</th><th class="n">USD</th></tr></thead><tbody>${CR.byCreator.map(l => `<tr><td>${esc(l.creator)}</td><td class="cap">${esc(l.deliverables)}</td><td class="n">${F.usd(l.usd)}</td></tr>`).join("")}</tbody></table></div>` : `<p class="small muted">None yet.</p>`}
        ${Ev && Ev.T.influencerPer1kCollab != null ? `<p class="small muted" style="margin-top:8px">${F.usd(Ev.T.influencerPer1kCollab)} of influencer cost per 1,000 collab views.</p>` : ""}
      </div>
    </div>
    ${Ev ? `<div class="sec"><h2>What it bought — ${esc(CR.event.name)}</h2>${tiles([
      ["Total spend", F.usd(Ev.T.totalSpend), "costs + ads"], ["Total views", F.big(Ev.T.totalViews), `${F.pct(Ev.T.pctOrganic)} organic`],
      ["Blended CPM", F.usd(Ev.T.blendedCPM), "per 1,000 views"], ["Organic CPM", Ev.T.organicCPM == null ? "—" : F.usd(Ev.T.organicCPM), "non-ad cost ÷ organic views"],
      ["Ads CPM", or(Ev.T.adsCPM, F.usd), ""], ["Cost / engagement", F.usd(Ev.T.costPerEngagement), ""],
    ])}<p style="margin-top:10px"><a class="btn ghost sm" href="#/r/${CR.event.id}">Open event report →</a></p></div>`
    : `<div class="sec"><div class="empty">Not linked to an event report yet. Link it under <a href="#/r/${rep.id}/costs">Costs › Details</a> to see CPM.</div></div>`}`;
}

/* every line editable in place */
function costingLines(body, rep, CR, D){
  const events = Object.values(D.reports).filter(r => r.type === "event");
  const linked = CR.event;
  const curOpts = cur => [...new Set([...Object.keys(CR.fx), cur])].map(c => `<option ${c === cur ? "selected" : ""}>${esc(c)}</option>`).join("");
  const inp = (list, i, k, v, w = 120, type = "text") => `<input class="ed" style="width:${w}px" type="${type}" data-l="${list}:${i}:${k}" value="${esc(v ?? "")}">`;
  const pick = (list, i) => `<td><input type="checkbox" data-pick="${list}:${i}" aria-label="Select line"></td>`;
  const infRows = CR.influencers.map((l, i) => `<tr>${pick("influencers", i)}<td>${inp("influencers", i, "creator", l.creator, 150)}</td><td>${inp("influencers", i, "deliverables", l.deliverables, 200)}</td><td>${inp("influencers", i, "date", l.date, 120, "date")}</td><td>${inp("influencers", i, "fee", l.fee, 90)}</td><td><select class="ed" data-l="influencers:${i}:currency">${curOpts(l.currency)}</select></td><td class="n">${F.usd(l.usd)}</td><td>${inp("influencers", i, "invoiceNo", l.invoiceNo, 90)}</td><td>${inp("influencers", i, "receipt", l.receipt, 140)}</td><td><button class="x" data-move="influencers:${i}" title="Move to event costs">⇄</button><button class="x" data-del="influencers:${i}" title="Delete this expense">🗑</button></td></tr>`);
  const evRow = (l, i) => `<tr>${pick("eventCosts", i)}<td><select class="ed" data-l="eventCosts:${i}:category">${E.COST_CATEGORIES.map(c => `<option ${c === l.category ? "selected" : ""}>${c}</option>`).join("")}</select></td><td>${inp("eventCosts", i, "item", l.item, 180)}</td><td>${inp("eventCosts", i, "vendor", l.vendor, 140)}</td><td>${inp("eventCosts", i, "date", l.date, 120, "date")}</td><td>${inp("eventCosts", i, "qty", l.qty, 50)}</td><td>${inp("eventCosts", i, "unit", l.unit, 90)}</td><td><select class="ed" data-l="eventCosts:${i}:currency">${curOpts(l.currency)}</select></td><td class="n">${F.usd(l.usd)}</td><td>${inp("eventCosts", i, "invoiceNo", l.invoiceNo, 90)}</td><td>${inp("eventCosts", i, "receipt", l.receipt, 140)}</td><td><button class="x" data-move="eventCosts:${i}" title="Move to influencers">⇄</button><button class="x" data-del="eventCosts:${i}" title="Delete this expense">🗑</button></td></tr>`;
  const evRows = E.COST_CATEGORIES.flatMap(cat => {
    const ls = CR.eventCosts.filter(l => l.category === cat);
    if (!ls.length) return [];
    return [`<tr class="seg"><td colspan="8">${esc(cat)} · ${ls.length}</td><td class="n">${F.usd(ls.reduce((a, l) => a + (l.usd || 0), 0))}</td><td colspan="3"></td></tr>`, ...ls.map(l => evRow(l, l.i))];
  });
  body.innerHTML = `
    <div class="sec"><h2>Details</h2><div class="card"><div class="fields">
      <label class="f">Event name *<input type="text" id="k-name" value="${esc(rep.eventName || CR.event?.name || rep.name || "")}"></label>
      <label class="f">Start<input type="date" id="k-start" value="${rep.start || ""}"></label>
      <label class="f">End<input type="date" id="k-end" value="${rep.end || ""}"></label>
      <label class="f">For event report<select id="k-event"><option value="">Not linked</option>${events.map(e => `<option value="${e.id}" ${linked?.id === e.id ? "selected" : ""} ${e.costingId && e.costingId !== rep.id ? "disabled" : ""}>${esc(e.name)}${e.costingId && e.costingId !== rep.id ? " (has its own)" : ""}</option>`).join("")}</select></label>
      <label class="f">Colour<select id="k-colour">${Object.keys(E.EVENT_COLOURS).map(c => `<option ${rep.colour === c ? "selected" : ""}>${c}</option>`).join("")}</select></label>
    </div>
    <details style="margin-top:14px"><summary>FX rates (USD per 1 unit)</summary>
      <div class="fields" style="margin-top:10px">${Object.keys(CR.fx).filter(c => c !== "USD").map(c => `<label class="f">${c}<input type="text" data-kfx="${c}" value="${CR.fx[c]}"></label>`).join("")}
      <label class="f">Add currency<input type="text" id="k-fxnew" placeholder="e.g. JPY=0.0067"></label></div>
    </details>
    <div class="row" style="margin-top:14px"><button class="btn danger sm" id="k-del">Delete costing report</button></div></div></div>

    ${CR.flags.filter(f => f.level === "bad").length ? `<div class="sec">${flagsHTML({ flags: CR.flags.filter(f => f.level === "bad"), rep }, 0)}</div>` : ""}
    <div class="selbar" id="selbar" hidden><span id="selcount"></span><button class="btn danger sm" id="seldel">Delete selected</button><button class="btn ghost sm" id="selnone">Clear selection</button></div>
    <div class="sec"><h2>Influencers &amp; models</h2>
      ${infRows.length ? `<div class="tw"><table><thead><tr><th><input type="checkbox" data-pickall="influencers" aria-label="Select all"></th><th>Creator / model</th><th>Deliverables</th><th>Date</th><th>Fee</th><th>Cur.</th><th class="n">USD</th><th>Invoice #</th><th>Receipt link</th><th></th></tr></thead><tbody>${infRows.join("")}
        <tr class="total"><td colspan="6">Influencers total</td><td class="n">${F.usd(CR.T.influencerCost)}</td><td colspan="3"></td></tr></tbody></table></div>` : `<p class="small muted">None yet.</p>`}
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="k-addinf">+ Add influencer</button></div>
    </div>
    <div class="sec"><h2>Event costs</h2>
      ${evRows.length ? `<div class="tw"><table><thead><tr><th><input type="checkbox" data-pickall="eventCosts" aria-label="Select all"></th><th>Category</th><th>Item</th><th>Vendor</th><th>Date</th><th>Qty</th><th>Unit price</th><th>Cur.</th><th class="n">USD</th><th>Invoice #</th><th>Receipt link</th><th></th></tr></thead><tbody>${evRows.join("")}
        <tr class="total"><td colspan="8">Event costs total</td><td class="n">${F.usd(CR.T.eventCost)}</td><td colspan="3"></td></tr></tbody></table></div>` : `<p class="small muted">None yet.</p>`}
      <div class="row" style="margin-top:8px"><button class="btn ghost sm" id="k-addcost">+ Add cost</button></div>
    </div>
    <div class="sec"><div class="flag info"><b>Total</b><span>${F.usd(CR.T.total)} — influencers ${F.usd(CR.T.influencerCost)} + event costs ${F.usd(CR.T.eventCost)}. Ads are counted in the event report, from the ad exports.</span></div></div>`;

  const save = patch => put("ss.report." + rep.id, { ...db().reports[rep.id], ...patch });
  const nm = body.querySelector("#k-name");
  nm.onchange = () => {
    const v = nm.value.trim();
    if (!v) { toast("A costing report needs its event name"); nm.value = rep.eventName || rep.name || ""; return; }
    save({ name: v, eventName: v, fresh: false }); render();
  };
  if (rep.fresh) { nm.focus(); nm.select(); }
  body.querySelector("#k-start").onchange = e => { save({ start: e.target.value }); render(); };
  body.querySelector("#k-end").onchange = e => { save({ end: e.target.value }); render(); };
  body.querySelector("#k-colour").onchange = e => { save({ colour: e.target.value }); render(); };
  body.querySelector("#k-event").onchange = e => {
    const D2 = db();
    if (linked && linked.id !== e.target.value) put("ss.report." + linked.id, { ...D2.reports[linked.id], costingId: null });
    if (e.target.value) put("ss.report." + e.target.value, { ...D2.reports[e.target.value], costingId: rep.id });
    render();
  };
  body.querySelectorAll("[data-kfx]").forEach(el => el.onchange = () => { const v = E.num(el.value); if (v == null) return toast("Not a number"); save({ fx: { ...CR.fx, [el.dataset.kfx]: v } }); render(); });
  body.querySelector("#k-fxnew").onchange = e => { const m = e.target.value.match(/^\s*([A-Za-z]{3})\s*[=:]\s*([\d.]+)/); if (!m) return toast("Use the form JPY=0.0067"); save({ fx: { ...CR.fx, [m[1].toUpperCase()]: +m[2] } }); render(); };
  body.querySelector("#k-del").onclick = () => deleteReport(db().reports[rep.id]);
  const NUMS = new Set(["fee", "qty", "unit"]);
  body.querySelectorAll("[data-l]").forEach(el => el.onchange = () => {
    const [list, i, k] = el.dataset.l.split(":");
    const cur = db().reports[rep.id];
    const lines = [...(cur[list] || [])];
    lines[+i] = { ...lines[+i], [k]: NUMS.has(k) ? E.num(el.value) : el.value };
    save({ [list]: lines }); render();
  });
  /* delete one or many expenses — always undoable */
  const deleteLines = picks => {
    const cur = db().reports[rep.id];
    const before = { influencers: cur.influencers || [], eventCosts: cur.eventCosts || [] };
    const drop = { influencers: new Set(), eventCosts: new Set() };
    for (const p of picks) { const [list, i] = p.split(":"); drop[list].add(+i); }
    save({ influencers: before.influencers.filter((_, j) => !drop.influencers.has(j)), eventCosts: before.eventCosts.filter((_, j) => !drop.eventCosts.has(j)) });
    render();
    const n = picks.length;
    toast(`Deleted ${n} expense${n > 1 ? "s" : ""}`, { label: "Undo", fn: () => { save(before); render(); } });
  };
  body.querySelectorAll("[data-del]").forEach(b => b.onclick = () => deleteLines([b.dataset.del]));
  const picked = () => [...body.querySelectorAll("[data-pick]:checked")].map(x => x.dataset.pick);
  const syncBar = () => {
    const n = picked().length;
    body.querySelector("#selbar").hidden = !n;
    body.querySelector("#selcount").textContent = `${n} selected`;
  };
  body.querySelectorAll("[data-pick]").forEach(x => x.onchange = syncBar);
  body.querySelectorAll("[data-pickall]").forEach(x => x.onchange = () => {
    body.querySelectorAll(`[data-pick^="${x.dataset.pickall}:"]`).forEach(c => (c.checked = x.checked)); syncBar();
  });
  body.querySelector("#seldel").onclick = () => { const p = picked(); if (p.length) deleteLines(p); };
  body.querySelector("#selnone").onclick = () => { body.querySelectorAll("[data-pick],[data-pickall]").forEach(c => (c.checked = false)); syncBar(); };
  body.querySelectorAll("[data-move]").forEach(b => b.onclick = () => {          // wrong list? flip it
    const [list, i] = b.dataset.move.split(":"); const cur = db().reports[rep.id];
    const l = cur[list][+i];
    const moved = list === "influencers"
      ? E.invoiceToLine({ type: "event", category: "Other", vendor: l.creator, item: l.deliverables, amount: l.fee, currency: l.currency, date: l.date, invoiceNo: l.invoiceNo, receipt: l.receipt, fileName: l.source })
      : E.invoiceToLine({ type: "influencer", vendor: l.vendor, item: l.item, amount: (l.qty == null ? 1 : l.qty) * (l.unit || 0), currency: l.currency, date: l.date, invoiceNo: l.invoiceNo, receipt: l.receipt, fileName: l.source });
    save({ [list]: cur[list].filter((_, j) => j !== +i), [moved.list]: [...(cur[moved.list] || []), moved.line] }); render();
  });
  body.querySelector("#k-addinf").onclick = () => { const cur = db().reports[rep.id]; save({ influencers: [...(cur.influencers || []), { creator: "", deliverables: "", fee: null, currency: "USD" }] }); render(); };
  body.querySelector("#k-addcost").onclick = () => { const cur = db().reports[rep.id]; save({ eventCosts: [...(cur.eventCosts || []), { category: "Other", item: "", qty: null, unit: null, currency: "USD", vendor: "" }] }); render(); };
}

/* ───────── adding invoices: read, sort, review, add ───────── */
const PDFJS = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/";
let pdfLib = null, ocrLib = null;
async function loadPdf(){
  if (!pdfLib) { pdfLib = await import(PDFJS + "pdf.min.mjs"); pdfLib.GlobalWorkerOptions.workerSrc = PDFJS + "pdf.worker.min.mjs"; }
  return pdfLib;
}
function loadOcr(){
  if (!ocrLib) ocrLib = new Promise((ok, no) => {
    const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => ok(window.Tesseract); s.onerror = () => no(new Error("Couldn't load the photo reader"));
    document.head.append(s);
  });
  return ocrLib;
}
async function ocr(img){
  const T = await loadOcr();
  // flatten onto white (transparent PNGs/HEICs read as black otherwise) and enlarge small images
  let src = img;
  try {
    const bmp = img instanceof HTMLCanvasElement ? img : await createImageBitmap(img);
    const k = Math.min(3, Math.max(1, 1600 / bmp.width));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
    const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0, 0, c.width, c.height); g.drawImage(bmp, 0, 0, c.width, c.height);
    src = c;
  } catch { /* formats the browser can't decode go to the reader as they are */ }
  const { data } = await T.recognize(src, "eng");
  return data.text || "";
}
/* PDF text, rebuilt into lines by position; scanned PDFs fall back to reading the page image */
async function pdfPages(file){
  const lib = await loadPdf();
  const doc = await lib.getDocument({ data: await file.arrayBuffer() }).promise;
  const pages = [];
  for (let p = 1; p <= Math.min(doc.numPages, 40); p++) {
    let text = "";
    const page = await doc.getPage(p);
    const tc = await page.getTextContent();
    const rows = new Map();
    for (const it of tc.items) {
      if (!it.str?.trim()) continue;
      const y = Math.round(it.transform[5] / 3);
      if (!rows.has(y)) rows.set(y, []);
      rows.get(y).push(it);
    }
    text = [...rows.entries()].sort((a, b) => b[0] - a[0]).map(([, its]) => its.sort((a, b) => a.transform[4] - b.transform[4]).map(i => i.str).join("  ")).join("\n");
    if (text.replace(/\s/g, "").length < 40 && p <= 15) {        // a scanned page: no text layer, read the image
      const vp = page.getViewport({ scale: 2 });
      const c = document.createElement("canvas"); c.width = vp.width; c.height = vp.height;
      await page.render({ canvasContext: c.getContext("2d"), viewport: vp }).promise;
      text = await ocr(c);
    }
    pages.push(text);
  }
  return pages;
}
const SKIP_FILE = /^(\.|~\$|thumbs\.db$|desktop\.ini$)/i;             // hidden/system files in folders
const SHEET_EXT = /\.(xlsx|xlsm|xlsb|xls|ods|numbers|csv|tsv)$/i;
const loadScript = (src, global) => window[global] ? Promise.resolve(window[global]) : new Promise((ok, no) => {
  const s = document.createElement("script"); s.src = src;
  s.onload = () => ok(window[global]); s.onerror = () => no(new Error("Couldn't load a file reader — check the connection"));
  document.head.append(s);
});
const loadXlsx = () => loadScript("https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js", "XLSX");
const loadMammoth = () => loadScript("https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js", "mammoth");
const loadHeic = () => loadScript("https://cdn.jsdelivr.net/npm/heic2any@0.0.4/dist/heic2any.min.js", "heic2any");
const htmlText = h => { const d = new DOMParser().parseFromString(h, "text/html"); d.querySelectorAll("script,style").forEach(x => x.remove()); return d.body?.innerText || d.body?.textContent || ""; };

/* Spreadsheet file (Excel, Numbers, ODS, CSV) → its tabs as CSV text */
async function sheetTabs(f){
  if (/\.(csv|tsv)$/i.test(f.name)) return [{ name: f.name.replace(/\.[^.]+$/, ""), text: await f.text() }];
  const X = await loadXlsx();
  const wb = X.read(await f.arrayBuffer(), { type: "array", cellDates: true });
  return wb.SheetNames.map(n => ({ name: wb.SheetNames.length > 1 ? n : f.name.replace(/\.[^.]+$/, ""), sheet: n, text: X.utils.sheet_to_csv(wb.Sheets[n], { blankrows: false }) }))
    .filter(t => t.text.replace(/[,\s]/g, "").length);
}

/* Any document → plain text (PDF pages, photos via OCR, Word, email, web page, RTF, plain text) */
async function docText(f){
  const n = f.name.toLowerCase();
  if (/\.pdf$/.test(n) || f.type === "application/pdf") return await pdfPages(f);
  if (/\.(heic|heif)$/.test(n)) { const conv = await loadHeic(); const png = await conv({ blob: f, toType: "image/png" }); return [await ocr(Array.isArray(png) ? png[0] : png)]; }
  if (/^image\//.test(f.type) || /\.(png|jpe?g|webp|gif|bmp|tiff?)$/.test(n)) return [await ocr(f)];
  if (/\.docx$/.test(n)) { const m = await loadMammoth(); return [(await m.extractRawText({ arrayBuffer: await f.arrayBuffer() })).value]; }
  if (/\.(html?|htm)$/.test(n)) return [htmlText(await f.text())];
  if (/\.eml$/.test(n)) { const t = await f.text(); const body = t.split(/\r?\n\r?\n/).slice(1).join("\n\n"); return [/<html|<body|<div/i.test(body) ? htmlText(body) : body]; }
  if (/\.rtf$/.test(n)) return [(await f.text()).replace(/\\par[d]?/g, "\n").replace(/\{\*?\\[^{}]+}|[{}]|\\[a-z]+-?\d* ?/gi, "")];
  if (/\.(doc|pages|key|ppt|pptx|zip|rar|7z)$/.test(n)) throw new Error(/zip|rar|7z/.test(n) ? "Unzip it first, then drop the folder" : "Export it as PDF first");
  // anything else: use it if it's readable text
  const t = await f.text();
  if ((t.match(/[\x00-\x08\x0E-\x1F]/g) || []).length > t.length * 0.01) throw new Error("Can't read this file type — export it as PDF");
  return [t];
}
/* everything inside dropped folders (skips hidden and unreadable files) */
async function filesFromDrop(dt){
  const entries = [...dt.items].map(i => i.webkitGetAsEntry?.()).filter(Boolean);
  if (!entries.length) return [...dt.files];
  const out = [];
  const walk = async entry => {
    if (SKIP_FILE.test(entry.name)) return;
    if (entry.isFile) { const f = await new Promise((ok, no) => entry.file(ok, no)); f.relPath = entry.fullPath.replace(/^\//, ""); out.push(f); return; }
    const reader = entry.createReader();
    let batch;
    do { batch = await new Promise((ok, no) => reader.readEntries(ok, no)); for (const e of batch) await walk(e); } while (batch.length);
  };
  for (const e of entries) await walk(e);
  return out;
}
/* Any file → invoices: a spreadsheet gives one per row, a document one per invoice inside it */
async function readFileToInvoices(f){
  const name = f.name || "file";
  if (SHEET_EXT.test(name) || /\.txt$/i.test(name) && /[\t,].*\n/.test((await f.text()).slice(0, 500))) {
    const tabs = SHEET_EXT.test(name) ? await sheetTabs(f) : [{ name, text: await f.text() }];
    const rows = tabs.flatMap(t => E.mapInvoiceRows(E.parseTable(t.text)).filter(r => r.amount != null).map(r => ({ ...r, fileName: tabs.length > 1 ? `${name} · ${t.name}` : name })));
    if (rows.length) return rows;
    if (/\.(csv|tsv|txt)$/i.test(name)) return [E.readInvoice(tabs[0].text, name)];
    throw new Error("No costs found — it needs a header row with an Amount column");
  }
  const parts = E.splitInvoicePages(await docText(f));
  return parts.map((t, i) => E.readInvoice(t, parts.length > 1 ? `${name} · invoice ${i + 1} of ${parts.length}` : name));
}

/* put read invoices in a costing report's review list (duplicates flagged and unticked) */
function queueInvoices(costingId, items){
  const cur = db().reports[costingId] || {};
  const next = [...(QUEUE.get(costingId) || [])];
  for (const x of items) {
    const dup = !x.error && (E.isDuplicate(x, cur) || next.some(y => !y.error && y.amount === x.amount && y.vendor === x.vendor && (y.invoiceNo || "") === (x.invoiceNo || "")));
    next.push({ ...x, dup, use: !x.error && !dup && x.amount != null });
  }
  QUEUE.set(costingId, next);
}

/* ───────── Google Sheet import ─────────
   Reads a link-shared sheet as CSV (Google allows this from the browser) and loads its
   posts, per-post ad numbers and account summary into a report. */
async function sheetCsv(sheetId, gid){
  let text;
  try {
    const r = await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/export?format=csv&gid=${gid}`);
    text = r.ok ? await r.text() : "";
  } catch { text = ""; }
  if (!text || /^\s*<!doctype|<html/i.test(text)) throw new Error("Couldn't open the sheet. Share it as “Anyone with the link can view” and try again.");
  return text;
}

const sheetLink = (id, gid) => `https://docs.google.com/spreadsheets/d/${id}/edit#gid=${gid}`;
const sameSheet = (a, b) => {
  const k = u => { const m = String(u || "").match(/spreadsheets\/d\/([\w-]{20,})/); return m ? m[1] + ":" + ((String(u).match(/[#&?]gid=(\d+)/) || [])[1] || "0") : String(u || ""); };
  return !!k(a) && k(a) === k(b);                                   // uploaded files compare by "file:<name>#<tab>"
};
/* a report made from this sheet tab that someone deleted — don't bring it back */
const deletedFromSheet = url => Object.values(docs).some(v => v?.deleted && v.sheetUrl && sameSheet(v.sheetUrl, url));

async function importSheet(url, repId, costs){
  const m = String(url || "").match(/spreadsheets\/d\/([\w-]{20,})/);
  if (!m) throw new Error("That isn't a Google Sheets link.");
  const gid = (String(url).match(/[#&?]gid=(\d+)/) || [])[1] || "0";
  url = sheetLink(m[1], gid);
  const text = await sheetCsv(m[1], gid);
  if (E.isEventSheet(text)) return importEventTab(text, url, repId, costs);
  return importWeeklyText(text, url, repId);
}

/* A weekly report tab's text (from a link or an uploaded file) → weekly report */
function importWeeklyText(text, url, repId){
  const S = E.parseReportSheet(text);
  if (!S.posts.length) throw new Error(S.notes[0] || "No posts found in that tab — check the link points at the report tab.");

  let rep = repId ? db().reports[repId] : Object.values(db().reports).find(r => r.type !== "costing" && sameSheet(r.sheetUrl, url)) || null;
  if (!rep) {                                                  // one-click import: make the report
    const type = S.type || "week", id = uid();
    rep = { id, type, name: type === "week" ? `Week of ${F.date(S.range?.start || today())}` : (S.title.split("·")[0].trim() || "Imported event"),
      start: S.range?.start || today(), end: S.range?.end || today(), dataDate: S.pulled || today(), importIds: [], postIds: [], account: {},
      otherSpend: [], influencers: [], eventCosts: [], colour: type === "week" ? "" : "Pink", fx: { ...db().settings.fx } };
  }
  const pulled = S.pulled || rep.dataDate || today();
  const merged = E.mergePosts(db().posts, S.posts, pulled, rep.type === "event" ? rep.id : null);
  for (const p of Object.values(merged)) put("ss.post." + p.id, p);

  const patch = { sheetUrl: url, dataDate: rep.dataDate || pulled };
  if (rep.type === "event") patch.postIds = [...new Set([...(rep.postIds || []), ...S.posts.map(p => p.id)])];
  if (S.range && (rep.fresh || !repId)) Object.assign(patch, { start: S.range.start, end: S.range.end });
  if (rep.type === "week") {
    const acc = { ...(rep.account || {}) };
    for (const [k, v] of Object.entries(S.account)) if (v != null) acc[k] = v;     // the sheet's numbers win on refresh
    patch.account = acc;
  }
  // per-post ad numbers from the sheet stand in for a Meta export, unless a real export is attached
  const D = db();
  const realExports = (rep.importIds || []).filter(i => D.imports[i] && !D.imports[i].fromSheet);
  let sheetImp = (rep.importIds || []).find(i => D.imports[i]?.fromSheet);
  if (S.ads.length && !realExports.length) {
    const id = sheetImp || uid();
    put("ss.import." + id, { id, name: "Ad numbers from the report sheet", fromSheet: true, level: "ad", hasViews: true, hasFollows: false, hasPostIds: true,
