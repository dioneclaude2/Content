      warnings: ["Taken from the sheet's ad columns — upload the Meta export for campaigns and follows."] });
    patch.importIds = [...new Set([...(rep.importIds || []), id])];
  }
  put("ss.report." + rep.id, { ...rep, ...patch, fresh: false });
  const acc = Object.keys(S.account).length;
  return { id: rep.id, msg: `Read ${S.posts.length} posts (pulled ${F.date(pulled)})${S.ads.length ? `, ${S.ads.length} boosted post${S.ads.length > 1 ? "s" : ""} with ad numbers` : ""}${acc ? `, ${acc} account numbers` : ""}.${S.notes.length ? ` <span class="down">${esc(S.notes.join(" "))}</span>` : ""}` };
}

/* One event tab → event report (+ its ad numbers, + a costing report when the Total Spend tab gave costs). */
function importEventTab(text, url, repId, costs){
  const S = E.parseEventSheet(text);
  if (!S.posts.length) throw new Error(S.notes[0] || "No posts found in that tab.");
  const D = db();
  let rep = repId ? D.reports[repId] : Object.values(D.reports).find(r => r.type === "event" && sameSheet(r.sheetUrl, url));
  if (!rep) {
    const colour = Object.keys(E.EVENT_COLOURS).find(k => S.name.toLowerCase().includes(k.toLowerCase()))
      || (/london fashion/i.test(S.name) ? "LFW" : "Pink");
    rep = { id: uid(), type: "event", name: S.name, colour, postIds: [], importIds: [], influencers: [], eventCosts: [], fx: { ...D.settings.fx } };
  }
  const pulled = S.dataDate || rep.dataDate || today();
  const merged = E.mergePosts(db().posts, S.posts, pulled, rep.id);
  for (const p of Object.values(merged)) put("ss.post." + p.id, p);
  const patch = { sheetUrl: url, start: S.range?.start || rep.start || today(), end: S.range?.end || rep.end || today(), dataDate: pulled,
    postIds: [...new Set([...(rep.postIds || []), ...S.postIds])], sheetNotes: S.sheetNotes, fresh: false };
  const realExports = (rep.importIds || []).filter(i => D.imports[i] && !D.imports[i].fromSheet);
  if (S.ads.length && !realExports.length) {
    const id = (rep.importIds || []).find(i => D.imports[i]?.fromSheet) || uid();
    put("ss.import." + id, { id, name: `${S.name} — ad numbers from the event sheet`, fromSheet: true, level: "ad", hasViews: true, hasFollows: false, hasPostIds: true,
      rows: S.ads.map((a, i) => ({ ...a, i })), rangeStart: S.range?.start || null, rangeEnd: pulled, uploaded: today(),
      warnings: ["Taken from the event sheet's rows — upload the Meta exports for ad-level detail and follows."] });
    patch.importIds = [...new Set([...(rep.importIds || []), id])];
  }
  // costs from the Total Spend tab become this event's costing report (two summary lines until invoices are added)
  if (costs && (costs.influencerCost != null || costs.eventCost != null)) {
    const lines = {
      influencers: costs.influencerCost != null ? [{ creator: "Influencer invoices (total from sheet)", deliverables: "", fee: costs.influencerCost, currency: "USD", source: "Total Spend tab" }] : [],
      eventCosts: costs.eventCost != null ? [{ category: "Other", item: "Event costs (total from sheet)", qty: null, unit: costs.eventCost, currency: "USD", vendor: "", source: "Total Spend tab" }] : [],
    };
    const existing = rep.costingId && D.reports[rep.costingId];
    const deletedOne = Object.values(docs).some(v => v?.deleted && v.type === "costing" && v.wasFor === rep.id);
    if (deletedOne && !existing) { /* someone deleted this event's costing: leave it deleted */ }
    else if (!existing) patch.costingId = newCosting({ name: S.name, eventName: S.name, start: patch.start, end: patch.end, colour: rep.colour, ...lines });
    else if ((existing.influencers || []).every(l => l.source === "Total Spend tab") && (existing.eventCosts || []).every(l => l.source === "Total Spend tab"))
      put("ss.report." + existing.id, { ...existing, ...lines });      // refresh only if nobody has added real invoices
  }
  put("ss.report." + rep.id, { ...rep, ...patch });
  return { id: rep.id, msg: `Read ${S.posts.length} posts and ${S.ads.length} ad rows for ${esc(S.name)} (data ${F.date(pulled)}).${S.notes.length ? ` <span class="down">${esc(S.notes.join(" "))}</span>` : ""}` };
}

/* #/import?sheet=ID&gid=G                    → one report
   #/import?sheet=ID&events=G1,G2&totals=GT    → every event tab, with costs from the Total Spend tab */
/* All tabs of a workbook (Google's sheet viewer lists them), else just the tab in the link. */
async function listTabs(sheetId, fallbackGid){
  try {
    const html = await (await fetch(`https://docs.google.com/spreadsheets/d/${sheetId}/htmlview`)).text();
    const tabs = [...html.matchAll(/\{name: "((?:[^"\\]|\\.)*)", pageUrl: "[^"]*?gid=(\d+)/g)].map(m => ({ name: m[1].replace(/\\(.)/g, "$1"), gid: m[2] }));
    if (tabs.length) return tabs;
  } catch {}
  return [{ name: "", gid: fallbackGid || "0" }];
}

/* Import every recognisable tab: weekly report → weekly, event table → event (+ costs), cost list → costing (for review). */
async function importWorkbook(url, progress = () => {}){
  const m = String(url || "").match(/spreadsheets\/d\/([\w-]{20,})/);
  if (!m) throw new Error("That isn't a Google Sheets link.");
  const sid = m[1], gid = (String(url).match(/[#&?]gid=(\d+)/) || [])[1] || "0";
  const tabs = await listTabs(sid, gid);
  progress(`Reading ${tabs.length} tab${tabs.length > 1 ? "s" : ""}…`);
  const texts = await Promise.all(tabs.map(t => sheetCsv(sid, t.gid).catch(() => "")));
  return importTabs(tabs.map((t, i) => ({ name: t.name || "Sheet", text: texts[i], link: sheetLink(sid, t.gid), from: "Google Sheet" })));
}

/* Sheet tabs (from a link or uploaded files) → reports:
   weekly report → weekly · event table → event (+ costs from a summary tab) · Meta ad export → Ad exports library
   · list of invoices/costs → costing report for review */
function importTabs(tabs, eventName){
  let costsBy = {};
  for (const t of tabs) { const c = t.text ? E.parseEventTotals(t.text) : {}; if (Object.keys(c).length) { costsBy = { ...costsBy, ...c }; t.totals = true; } }
  const out = [];
  for (const t of tabs) {
    const { text, link, name: tab } = t;
    if (!text) { out.push({ tab, kind: "Skipped", note: "couldn't open it" }); continue; }
    if (t.totals) { out.push({ tab, kind: "Costs summary", note: "used for each event's costs" }); continue; }
    try {
      const T = E.parseTable(text);
      if (E.isEventSheet(text)) {
        const name = E.parseEventSheet(text).name;
        const key = Object.keys(costsBy).find(k => k.toLowerCase() === name.toLowerCase());
        out.push({ tab, kind: "Event", id: importEventTab(text, link, null, costsBy[key]).id, note: key ? "with costs" : "" });
      } else if (E.parseReportSheet(text).posts.length) {
        out.push({ tab, kind: "Weekly", id: importWeeklyText(text, link).id });
      } else if (T.headers.some(h => /^amount spent/i.test(h)) && T.headers.some(h => /^(ad|campaign) name$/i.test(h))) {
        const imp = E.mapAds(T, tab);
        if (imp.errors.length) { out.push({ tab, kind: "Skipped", note: "Meta ad export — " + imp.errors[0] }); continue; }
        const id = uid();
        put("ss.import." + id, { ...imp, id, uploaded: today(), errors: undefined });
        out.push({ tab, kind: "Ad export", note: `${imp.rows.length} ads saved under Ad exports — attach it to its report in Add data` });
      } else {
        const rows = E.mapInvoiceRows(T).filter(r => r.amount != null);
        if (!rows.length) { out.push({ tab, kind: "Skipped", note: "not a report, event table, ad export or cost list" }); continue; }
        const id = startCosting(eventName || (/^(sheet\d*|costs?|invoices?)$/i.test(tab) ? "Imported costs" : tab));
        queueInvoices(id, rows.map(r => ({ ...r, fileName: `${tab} (${t.from || "file"})` })));
        out.push({ tab, kind: "Costing", id, note: `${rows.length} costs waiting for review` });
      }
    } catch (e) { out.push({ tab, kind: "Skipped", note: e.message }); }
  }
  return out;
}

/* Files and folders → reports. Spreadsheets go through the same detector as sheet links;
   everything else is read as invoices, grouped into a costing report per folder (or the event name typed). */
async function importFiles(files, eventName, progress = () => {}){
  files = files.filter(f => !SKIP_FILE.test(f.name));
  if (!files.length) throw new Error("No files found.");
  const folderOf = f => { const p = (f.relPath || f.webkitRelativePath || "").split("/"); return p.length > 1 ? p[p.length - 2] : ""; };
  const tabs = [], invoices = new Map(), out = [];
  let i = 0;
  for (const f of files) {
    progress(`Reading ${++i} of ${files.length}: ${f.name}…`);
    try {
      if (SHEET_EXT.test(f.name)) {
        for (const t of await sheetTabs(f)) tabs.push({ ...t, link: `file:${f.name}#${t.sheet || t.name}`, from: f.name, folder: folderOf(f) });
      } else {
        const ev = eventName || folderOf(f);
        if (!invoices.has(ev)) invoices.set(ev, []);
        invoices.get(ev).push(...await readFileToInvoices(f));
      }
    } catch (e) { out.push({ tab: f.name, kind: "Skipped", note: e.message }); }
  }
  out.push(...importTabs(tabs, eventName));
  for (const [ev, items] of invoices) {
    if (!ev) { out.push({ tab: `${items.length} invoice${items.length > 1 ? "s" : ""}`, kind: "Skipped", note: "type the event name above (or drop them inside a folder named after the event)" }); continue; }
    const id = startCosting(ev);
    queueInvoices(id, items);
    out.push({ tab: ev, kind: "Costing", id, note: `${items.length} invoice${items.length > 1 ? "s" : ""} waiting for review` });
  }
  return out;
}

async function renderImport(q){
  if (q.get("events")) {
    app.innerHTML = `<h1>Importing events…</h1><p class="sub" id="imp-st">Reading the Google Sheet.</p>`;
    try {
      const sid = q.get("sheet");
      const costsBy = q.get("totals") ? E.parseEventTotals(await sheetCsv(sid, q.get("totals"))) : {};
      const done = [];
      for (const gid of q.get("events").split(",")) {
        const url = sheetLink(sid, gid);
        const text = await sheetCsv(sid, gid);
        const name = E.parseEventSheet(text).name;
        document.getElementById("imp-st").textContent = `Importing ${name}…`;
        const key = Object.keys(costsBy).find(k => k.toLowerCase() === name.toLowerCase());
        done.push(importEventTab(text, url, null, costsBy[key]).id);
      }
      toast(`Imported ${done.length} events`);
      location.replace("#/");

      app.innerHTML = `<h1>Couldn't import</h1><div class="flag bad" style="margin-top:14px"><b>Error</b><span>${esc(e.message)}</span></div><p><a class="btn" href="#/">Home</a></p>`;

  const url = q.get("sheet") ? `https://docs.google.com/spreadsheets/d/${q.get("sheet")}/edit#gid=${q.get("gid") || 0}` : "";
  app.innerHTML = `<h1>Importing…</h1><p class="sub">Reading the Google Sheet.</p>`;

    location.replace(`#/r/${id}/summary`);

    app.innerHTML = `<h1>Couldn't import</h1><div class="flag bad" style="margin-top:14px"><b>Error</b><span>${esc(e.message)}</span></div><p><a class="btn" href="#/">Home</a></p>`;
  }
}

  body.querySelector("#g-go").onclick = async () => {
    const res = body.querySelector("#g-res");
    res.className = "result"; res.textContent = "Reading the sheet…";
    try {
      const { msg } = await importSheet(body.querySelector("#g-url").value, rep.id);
      render(); const r2 = document.getElementById("g-res"); r2.className = "result ok"; r2.innerHTML = msg;
    } catch (e) { res.className = "result err"; res.textContent = e.message; }
  };

  /* posts */
  body.querySelector("#p-go").onclick = () => {
    const res = body.querySelector("#p-res");
    const pulled = body.querySelector("#p-date").value || today();
    const m = E.mapPosts(E.parseTable(body.querySelector("#p-text").value));
    if (!m.posts.length) { res.className = "result err"; res.innerHTML = esc(m.errors.join(" ") || "Nothing to add — paste rows with the header row."); return; }
    const existing = db().posts;
    const merged = E.mergePosts(existing, m.posts, pulled, isEv ? rep.id : null);
    for (const p of Object.values(merged)) put("ss.post." + p.id, p);
    const cur = db().reports[rep.id];
    if (isEv) save({ postIds: [...new Set([...(cur.postIds || []), ...m.posts.map(p => p.id)])], dataDate: cur.dataDate || pulled });
    const outside = !isEv ? m.posts.filter(p => !p.date || p.date < rep.start || p.date > rep.end).length : 0;
    render();
    const r2 = document.getElementById("p-res");
    r2.className = "result ok";
    r2.innerHTML = `Added ${m.posts.length} post${m.posts.length > 1 ? "s" : ""} (pulled ${F.date(pulled)}).`
      + (outside ? ` <span class="down">${outside} dated outside this week — kept in the library, not in this report.</span>` : "")
      + (m.missingCols.length ? ` <span class="down">Columns not found: ${m.missingCols.join(", ")}.</span>` : "")
      + (m.errors.length ? ` <span class="down">${esc(m.errors.join(" "))}</span>` : "")
      + (pulled !== rep.dataDate ? ` <span class="down">Pull date differs from the report's data date (${F.date(rep.dataDate)}).</span>` : "");
  };
  body.querySelectorAll("[data-rmpost]").forEach(b => b.onclick = () => { const cur = db().reports[rep.id]; save({ postIds: (cur.postIds || []).filter(i => i !== b.dataset.rmpost) }); render(); });
  body.querySelectorAll("[data-expost]").forEach(b => b.onclick = () => { const cur = db().reports[rep.id]; save({ exclude: [...new Set([...(cur.exclude || []), b.dataset.expost])] }); render(); });
  body.querySelectorAll("[data-unex]").forEach(b => b.onclick = e => { e.preventDefault(); const cur = db().reports[rep.id]; save({ exclude: (cur.exclude || []).filter(i => i !== b.dataset.unex) }); render(); });
  const pa = body.querySelector("#p-add");
  if (pa) pa.onclick = () => { const ids = [...body.querySelectorAll("[data-addpost]:checked")].map(x => x.dataset.addpost); const cur = db().reports[rep.id]; save({ postIds: [...new Set([...(cur.postIds || []), ...ids])] }); render(); };

  /* ads */
  const addImport = (text, name) => {
    const imp = E.mapAds(E.parseTable(text), name);
    const res = document.getElementById("a-res");
    if (imp.errors.length) { res.className = "result err"; res.innerHTML = `<b>${esc(name)}:</b> ${esc(imp.errors.join(" "))}`; return false; }
    if (!imp.rows.length) { res.className = "result err"; res.textContent = `${name}: no rows found.`; return false; }
    const id = uid();
    put("ss.import." + id, { ...imp, id, uploaded: today(), errors: undefined });
    const cur = db().reports[rep.id];
    save({ importIds: [...new Set([...(cur.importIds || []), id])] });
    return imp;
  };
  body.querySelector("#a-file").onchange = async e => {
    const out = [];
    for (const f of e.target.files) { const imp = addImport(await f.text(), f.name); if (imp) out.push(`${f.name}: ${imp.rows.length} rows`); else return; }
    render(); const res = document.getElementById("a-res"); res.className = "result ok"; res.textContent = "Added " + out.join(" · ");
  };
  body.querySelector("#a-paste").onclick = () => { const imp = addImport(body.querySelector("#a-text").value, `Pasted export ${today()}`); if (imp) { render(); toast(`Added ${imp.rows.length} ad rows`); } };
  body.querySelectorAll("[data-rmimp]").forEach(b => b.onclick = () => { const cur = db().reports[rep.id]; save({ importIds: (cur.importIds || []).filter(i => i !== b.dataset.rmimp) }); render(); });
  const at = body.querySelector("#a-attach");
  if (at) at.onchange = () => { if (!at.value) return; const cur = db().reports[rep.id]; save({ importIds: [...new Set([...(cur.importIds || []), at.value])] }); render(); };

  /* costs */
  if (isEv) {
    const kn = body.querySelector("#k-new");
    if (kn) kn.onclick = () => {
      const cur = db().reports[rep.id];
      const id = newCosting({ name: cur.name, eventName: cur.name, start: cur.start, end: cur.end, colour: cur.colour,
        influencers: cur.influencers || [], eventCosts: cur.eventCosts || [] });          // carries over any old lines
      save({ costingId: id }); location.hash = `#/r/${id}/add`;
    };
    const kl = body.querySelector("#k-link");
    if (kl) kl.onchange = () => { if (kl.value) { save({ costingId: kl.value }); render(); } };
    const ku = body.querySelector("#k-unlink");
    if (ku) ku.onclick = () => { save({ costingId: null }); render(); };
  } else {
    body.querySelectorAll("[data-acc]").forEach(el => el.onchange = () => {
      const cur = db().reports[rep.id];
      let v = E.num(el.value);
      if (v != null && el.dataset.pct && v > 1) v = v / 100;          // "62" and "62%" both mean 0.62
      save({ account: { ...(cur.account || {}), [el.dataset.acc]: v } }); render();
    });
    body.querySelector("#o-add").onclick = () => {
      const lines = body.querySelector("#o-text").value.split("\n").map(l => l.split(/\t|,/).map(s => s.trim())).filter(x => x[0])
        .map(([label, amount, currency]) => ({ label, amount: E.num(amount), currency: (currency || "USD").toUpperCase() })).filter(l => l.amount != null);
      if (!lines.length) return toast("Use: label, amount, currency");
      const cur = db().reports[rep.id]; save({ otherSpend: [...(cur.otherSpend || []), ...lines] }); render();
    };
  }
  const keyOf = { infl: "influencers", cost: "eventCosts", other: "otherSpend" };
  body.querySelectorAll("[data-rmline]").forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.rmline.split(":"); const cur = db().reports[rep.id];
    save({ [keyOf[k]]: (cur[keyOf[k]] || []).filter((_, j) => j !== +i) }); render();
  });
}
function costList(list, k, fmt){
  return list.length ? `<div class="list">${list.map((l, i) => `<div class="li"><span class="grow">${fmt(l)}</span><button class="x" data-rmline="${k}:${i}">×</button></div>`).join("")}</div>` : "";
}
function accField(k, label, rep, pct){
  const v = rep.account?.[k];
  const shown = v == null ? "" : pct ? (v * 100).toFixed(2).replace(/\.?0+$/, "") + "%" : v;
  return `<label class="f">${label}<input type="text" data-acc="${k}" ${pct ? 'data-pct="1"' : ""} value="${shown}"></label>`;
}

/* ───────── ad matching ───────── */
function renderMatch(body, rep, R, D){
  const allPosts = Object.values(D.posts).sort((a, b) => (a.date < b.date ? 1 : -1));
  const inRep = new Set(R.contentRows.map(r => r.id));
  const where = new Map();
  for (const r of R.rows) for (const a of r.ads) where.set(a.key, r);
  const HOW = { id: "Post ID / permalink", name: "Ad name ≈ caption", manual: "Set by hand", "manual-adonly": "Set by hand", none: "No match" };
  const rows = R.matchLog.map(m => {
    const r = where.get(m.ad.key);
    const opt = p => `<option value="${p.id}" ${rep.adMatch?.[m.ad.key] === p.id ? "selected" : ""}>${inRep.has(p.id) ? "★ " : ""}${esc(F.date(p.date))} · ${esc((p.content || p.id).slice(0, 50))}</option>`;
    return `<tr class="${m.how === "name" ? "extra" : m.how === "none" ? "adrow" : ""}">
      <td class="cap">${esc(m.ad.ad)}</td><td class="cap">${esc(m.ad.campaign)}</td><td class="n">${F.int(m.ad.views)}</td><td class="n">${F.usd(m.ad.usd)}</td>
      <td>${esc(HOW[m.how] || m.how)}</td><td class="small">${r ? `${esc(KIND[r.kind] || (rep.type === "week" ? "This week's post" : "Event post"))}${r.post ? " · " + link(r, 30) : ""}` : ""}</td>
      <td><select data-match="${m.ad.key}"><option value="">Automatic</option><option value="__adonly" ${rep.adMatch?.[m.ad.key] === "__adonly" ? "selected" : ""}>Ad only (no post)</option>${allPosts.filter(p => inRep.has(p.id)).map(opt).join("")}<optgroup label="Other posts">${allPosts.filter(p => !inRep.has(p.id)).slice(0, 200).map(opt).join("")}</optgroup></select></td></tr>`;
  });
  body.innerHTML = `<div class="sec"><h2>How each ad was matched</h2>
    <p class="sub" style="margin:-4px 0 14px">Order: post ID or permalink in the export → ad name vs caption (“… - Copy” counts as the same ad) → the fit rule: an ad is credited only if the post's paid views stay at or under its Instagram views, smallest ads first. Ads that don't fit ran on a dark-post copy and get their own row. Rows matched by name are shaded — check them. Pick a post by hand to override.</p>
    ${R.matchLog.length ? tbl("t-match", ["Ad name", "Campaign", N("Views"), N("Spend (USD)"), "Matched by", "Ended up as", "Override"], rows) : `<div class="empty">No ad exports attached yet. <a href="#/r/${rep.id}/data">Add data</a></div>`}
  </div>`;
  body.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(tableTSV(document.getElementById(b.dataset.copy)), "Table copied"));
  body.querySelectorAll("[data-match]").forEach(s => s.onchange = () => {
    const cur = db().reports[rep.id];
    const adMatch = { ...(cur.adMatch || {}) };
    if (s.value) adMatch[s.dataset.match] = s.value; else delete adMatch[s.dataset.match];
    put("ss.report." + rep.id, { ...cur, adMatch }); render();
  });
}

/* ───────── compare any two reports ───────── */
function renderCompare(D, q){
  const reps = Object.values(D.reports).sort((a, b) => ((a.start || "") < (b.start || "") ? 1 : -1));
  const a = D.reports[q.get("a")], b = D.reports[q.get("b")];
  const opts = sel => reps.map(r => `<option value="${r.id}" ${sel?.id === r.id ? "selected" : ""}>${r.type === "week" ? "Week" : "Event"} · ${esc(r.name)}</option>`).join("");
  let out = "";
  if (a && b) {
    const A = E.buildReport(a, D, D.settings), B = E.buildReport(b, D, D.settings);
    const side = (X, Y) => X.breakdown.map((g, i) => `<tr><td>${g.name}</td><td class="n">${g.posts} / ${Y.breakdown[i].posts}</td><td class="n">${F.int(g.views)} / ${F.int(Y.breakdown[i].views)}</td><td class="n">${vsBench(g.er, X.bench)} / ${vsBench(Y.breakdown[i].er, X.bench)}</td></tr>`);
    out = `<div class="sec"><h2>${esc(a.name)} vs ${esc(b.name)}</h2>${cmpTable("t-c", A, B, a.name, b.name)}
      <p class="small dim">Data dates: ${F.dateY(A.dataDate)} vs ${F.dateY(B.dataDate)}${A.dataDate !== B.dataDate ? " — different pull dates, so older content has had more time to collect views." : ""}</p></div>
      <div class="sec"><h2>Content breakdown</h2>${tbl("t-cb", ["", N("Posts"), N("Views"), N("Eng. rate")], side(A, B))}</div>`;
  }
  app.innerHTML = `<h1>Compare</h1><p class="sub">Any two reports side by side — week vs week, event vs event, or an event against the week it happened in.</p>
    <div class="card sec row"><select id="ca"><option value="">First report…</option>${opts(a)}</select><span class="muted">vs</span><select id="cb"><option value="">Second report…</option>${opts(b)}</select></div>${out}`;
  const go = () => { location.hash = `#/compare?a=${document.getElementById("ca").value}&b=${document.getElementById("cb").value}`; };
  document.getElementById("ca").onchange = go; document.getElementById("cb").onchange = go;
  app.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copy(tableTSV(document.getElementById(btn.dataset.copy)), "Table copied"));
}

/* ───────── library: posts ───────── */
function renderPosts(D, q){
  const term = (q.get("q") || "").toLowerCase();
  const evOf = id => Object.values(D.reports).filter(r => r.type === "event" && (r.postIds || []).includes(id)).map(r => r.name);
  const list = Object.values(D.posts).filter(p => !term || `${p.content} ${p.account} ${p.id}`.toLowerCase().includes(term)).sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1));
  const rows = list.map(p => {
    const { snap, date } = E.snapAt(p, null);
    const pulls = Object.keys(p.snaps || {}).length;
    return `<tr><td>${F.date(p.date)}</td><td>${who(p)}</td><td>${esc(p.format)}</td><td class="cap">${link(p, 50)}</td><td class="n">${F.int(snap?.views)}</td><td class="small">${F.date(date)}${pulls > 1 ? ` (+${pulls - 1} earlier)` : ""}</td><td>${chip(!!p.boosted)}</td><td class="small">${esc(evOf(p.id).join(", ") || "—")}</td><td><button class="x" data-delp="${p.id}" title="Delete post">×</button></td></tr>`;
  });
  app.innerHTML = `<h1>Posts</h1><p class="sub">Every post ever pasted in, stored once by its link. Each paste adds a dated snapshot — older numbers are kept.</p>
    <div class="sec row"><input type="text" id="ps" placeholder="Search caption, account, link…" value="${esc(q.get("q") || "")}" style="flex:1;max-width:420px"><span class="muted small">${list.length} posts</span></div>
    <div class="sec">${list.length ? tbl("t-lib", ["Posted", "Account", "Format", "Content", N("Latest views"), "Pulled", "Boosted", "Events", ""], rows) : `<div class="empty">No posts yet — add them inside a report.</div>`}</div>`;
  const ps = document.getElementById("ps");
  ps.onchange = () => { location.hash = `#/posts?q=${encodeURIComponent(ps.value)}`; };
  app.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => { if (confirm("Delete this post from every report?")) { del("ss.post." + b.dataset.delp); render(); } });
  app.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copy(tableTSV(document.getElementById(btn.dataset.copy)), "Table copied"));
}

/* ───────── library: ad exports ───────── */
function renderAds(D){
  const used = id => Object.values(D.reports).filter(r => (r.importIds || []).includes(id)).map(r => r.name);
  const fx = D.settings.fx;
  const list = Object.values(D.imports).sort((a, b) => ((a.uploaded || "") < (b.uploaded || "") ? 1 : -1));
  const rows = list.map(i => {
    const spend = i.rows.reduce((s, r) => s + (E.toUSD(r.spend, r.currency, fx) || 0), 0);
    const views = i.rows.reduce((s, r) => s + (r.views || 0), 0);
    return `<tr><td>${esc(i.name)}</td><td>${i.level}</td><td>${F.date(i.rangeStart)} → ${F.date(i.rangeEnd)}</td><td class="n">${i.rows.length}</td><td class="n">${F.usd(spend)}</td><td class="n">${F.int(views)}</td><td class="n">${F.usd(views ? spend / views * 1000 : null)}</td><td class="small">${esc(used(i.id).join(", ") || "—")}</td><td class="small">${esc((i.warnings || []).join(" "))}</td><td><button class="x" data-deli="${i.id}">×</button></td></tr>`;
  });
  app.innerHTML = `<h1>Ad exports</h1><p class="sub">Every Meta Ads Manager export uploaded. One export can feed several reports (a weekly report and an event report). Spend shown at default FX.</p>
    <div class="sec">${list.length ? tbl("t-imp", ["File", "Level", "Range", N("Rows"), N("Spend (USD)"), N("Views"), N("CPM"), "Used in", "Warnings", ""], rows) : `<div class="empty">No exports yet — upload them inside a report.</div>`}</div>`;
  app.querySelectorAll("[data-deli]").forEach(b => b.onclick = () => { if (confirm("Delete this export? Reports using it will lose its ads.")) { del("ss.import." + b.dataset.deli); render(); } });
  app.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copy(tableTSV(document.getElementById(btn.dataset.copy)), "Table copied"));
}

/* ───────── settings ───────── */
function renderSettings(D){
  const s = D.settings;
  app.innerHTML = `<h1>Settings</h1><p class="sub">Defaults for new reports. Each report keeps its own copy of the FX rates, so changing them here doesn't change old reports.</p>
  <div class="sec grid g2">
    <div class="card"><h3>Targets &amp; benchmarks</h3><div class="fields" style="margin-top:10px">
      <label class="f">Account views target<input type="text" id="s-tv" value="${s.target.views}"></label>
      <label class="f">Per<select id="s-tp">${["week", "month", "quarter"].map(p => `<option ${s.target.period === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      <label class="f">Eng. rate benchmark %<input type="text" id="s-b" value="${(s.benchmark * 100).toFixed(2)}"></label>
      <label class="f">Normal ads CPM from $<input type="text" id="s-c0" value="${s.cpmRange[0]}"></label>
      <label class="f">to $<input type="text" id="s-c1" value="${s.cpmRange[1]}"></label>
    </div><p class="small dim">Weekly reports prorate the target to the report's days. Benchmark: brand accounts ~1.9% per view (beauty ~2.1%), Dash Social 2026.</p></div>
    <div class="card"><h3>Default FX (USD per 1 unit)</h3><div class="fields" style="margin-top:10px">
      ${Object.entries(s.fx).filter(([c]) => c !== "USD").map(([c, v]) => `<label class="f">${c}<input type="text" data-sfx="${c}" value="${v}"></label>`).join("")}
    </div></div>
    <div class="card"><h3>Recently deleted</h3>
      ${(() => {
        const gone = Object.entries(docs).filter(([k, v]) => k.startsWith("ss.report.") && v?.deleted && v.deletedAt && Date.now() - v.deletedAt < 90 * 864e5)
          .sort((a, b) => b[1].deletedAt - a[1].deletedAt);
        return gone.length ? `<div class="list">${gone.map(([k, v]) => `<div class="li"><span class="chip k">${v.type === "week" ? "Weekly" : v.type === "costing" ? "Costing" : "Event"}</span><span class="grow">${esc(v.eventName || v.name || "Untitled")} <span class="muted small">· deleted ${new Date(v.deletedAt).toLocaleDateString("en-US", { month: "short", day: "numeric" })}</span></span><button class="btn ghost sm" data-restore="${k}">Restore</button></div>`).join("")}</div>`
          : `<p class="small muted">Nothing deleted in the last 90 days.</p>`;
      })()}
    </div>
    <div class="card"><h3>Sync &amp; backup</h3>
      <p class="sub">Status: <b>${document.getElementById("sync").innerText}</b>. Data is shared through the Vercel API (Upstash). If it says “This browser only”, the API isn't live yet and everything is saved in this browser.</p>
      <div class="row" style="margin-top:12px"><button class="btn sm" id="bk">Download backup</button><label class="btn ghost sm">Restore backup<input type="file" id="rs" accept=".json" hidden></label><button class="btn ghost sm" id="pc">Team passcode</button></div>
    </div>
  </div>`;
  const saveS = patch => { put("ss.settings", { ...(docs["ss.settings"] || {}), ...patch }); render(); };
  document.getElementById("s-tv").onchange = e => saveS({ target: { ...s.target, views: E.num(e.target.value) || s.target.views } });
  document.getElementById("s-tp").onchange = e => saveS({ target: { ...s.target, period: e.target.value } });
  document.getElementById("s-b").onchange = e => saveS({ benchmark: (E.num(e.target.value) || 1.9) / 100 });
  document.getElementById("s-c0").onchange = e => saveS({ cpmRange: [E.num(e.target.value) || 4, s.cpmRange[1]] });
  document.getElementById("s-c1").onchange = e => saveS({ cpmRange: [s.cpmRange[0], E.num(e.target.value) || 17] });
  app.querySelectorAll("[data-sfx]").forEach(el => el.onchange = () => saveS({ fx: { ...s.fx, [el.dataset.sfx]: E.num(el.value) } }));
  document.getElementById("bk").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(docs, null, 1)], { type: "application/json" }));
    a.download = `social-stats-backup-${today()}.json`; a.click();
  };
  document.getElementById("rs").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text()); let n = 0;
      for (const [k, v] of Object.entries(data)) if (/^ss\./.test(k) && v && (!docs[k] || (v.updatedAt || 0) > (docs[k].updatedAt || 0))) { docs[k] = v; sync.queue(k); n++; }
      saveLocal(); render(); toast(`Restored ${n} newer records`);
    } catch { toast("That file isn't a Social Stats backup"); }
  };
  document.getElementById("pc").onclick = askPass;
  app.querySelectorAll("[data-restore]").forEach(b => b.onclick = () => { restore(b.dataset.restore); toast("Restored"); render(); });
}

/* ───────── live from Google Sheets ─────────
   sources.json lists the team's sheets; every visit re-reads them, so any device
   (and anyone with the link) sees the same, current reports. Invoices and edits
   made in the app stay on top: a refresh never replaces a costing report that
   has real invoices, and a report someone deleted isn't re-created. */
async function refreshFromSources(){
  let src;
  try { src = await (await fetch("sources.json?v=dev", { cache: "no-cache" })).json(); } catch { return; }
  const chip = document.getElementById("sync");
  const label = chip.querySelector("span"), before = label.textContent;
  label.textContent = "Updating from Google Sheets…";
  let n = 0, failed = 0;
  for (const w of src.weekly || []) {
    const url = sheetLink(w.sheet, w.gid || "0");
    if (deletedFromSheet(url)) continue;
    try { await importSheet(url); n++; } catch (err) { failed++; console.warn("Weekly sheet", url, err); }
  }
  for (const e of src.events || []) {
    let costsBy = {};
    try { if (e.totals) costsBy = E.parseEventTotals(await sheetCsv(e.sheet, e.totals)); } catch { failed++; }
    for (const gid of e.tabs || []) {
      const url = sheetLink(e.sheet, gid);
      if (deletedFromSheet(url)) continue;
      try {
        const text = await sheetCsv(e.sheet, gid);
        const name = E.parseEventSheet(text).name;
        const key = Object.keys(costsBy).find(k => k.toLowerCase() === name.toLowerCase());
        importEventTab(text, url, null, costsBy[key]); n++;
      } catch (err) { failed++; console.warn("Sheet tab", gid, err); }
    }
  }
  label.textContent = before;
  if (n) {
    localStorage.setItem("ss.sourcesAt", String(Date.now()));
    if (route().name !== "new" && !editing()) render();          // never redraw a page someone is working on
  }
  sync.show(sync.state);                                       // badge: "Live from Google Sheets · <time>"
  if (failed) toast(`Couldn't read ${failed} sheet tab${failed > 1 ? "s" : ""} — check they're shared “Anyone with the link”.`);
}

render();
sync.pull();
refreshFromSources();
</script>
