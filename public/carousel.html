<!DOCTYPE html>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Carousel Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap">

<style>
:root{
  --bg:#F4F2F0; --ink:#111111; --muted:#8A8A8A; --line:#E2DFDC;
  --card:#FFFFFF; --pink:#FF2E9A;
  --sans:"Archivo","Helvetica Neue",Helvetica,Arial,sans-serif;
  --serif:"Playfair Display",Georgia,serif;
}
*{box-sizing:border-box}
/* our flex rows would otherwise beat the hidden attribute's display:none */
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
  -webkit-font-smoothing:antialiased;min-height:100vh;
  display:flex;flex-direction:column;align-items:center;padding:34px 18px 54px;
}
.eyebrow{font-family:var(--serif);font-size:19px;color:#9A9A9A;margin:0 0 10px}
h1{font-family:var(--serif);font-size:clamp(28px,6vw,40px);margin:0;text-align:center}
h1[contenteditable]:focus{outline:none;border-bottom:1px dashed var(--muted)}
.count{margin:8px 0 26px;font-size:15px;color:var(--muted)}

/* ---- phone ---- */
.phone{
  width:min(408px,100%);background:#0B0B0B;border-radius:44px;padding:12px;
  box-shadow:0 26px 60px rgba(0,0,0,.22);position:relative;
}
.notch{width:104px;height:15px;background:#000;border-radius:0 0 12px 12px;margin:0 auto 10px}
.post{background:var(--card);border-radius:32px;overflow:hidden}

.head{display:flex;align-items:center;gap:12px;padding:14px 16px}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--pink);flex:none}
.handle{font-weight:700;font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dotsmenu{color:#9A9A9A;letter-spacing:2px;font-size:18px;line-height:1}

.stage{position:relative;aspect-ratio:4/5;background:#EDEAE7;overflow:hidden}
.stage img,.stage video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:none}
.stage .on{display:block}
.hit{position:absolute;top:0;bottom:0;width:34%;cursor:pointer}
.hit.prev{left:0} .hit.next{right:0}

.bar{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid #F0EEEC}
.arrow{background:none;border:0;font-size:20px;color:#9A9A9A;cursor:pointer;padding:0 2px;line-height:1}
.arrow:disabled{opacity:.25;cursor:default}
.dots{flex:1;display:flex;justify-content:center;gap:6px;flex-wrap:wrap}
.dot{width:7px;height:7px;border-radius:50%;background:#D6D3D0}
.dot.on{background:#111}
.idx{font-size:14px;color:var(--muted);min-width:44px;text-align:right}

.cap{padding:6px 16px 14px;font-size:15px;line-height:1.45;white-space:pre-wrap;min-height:38px}
.cap:empty:before{content:attr(data-ph);color:#B5B2AF}
.cap:focus{outline:none}
.acts{display:flex;gap:16px;padding:0 16px 16px;font-size:19px;color:#111}

.hint{margin-top:22px;font-size:14px;color:#A8A5A2}

.drive{width:min(408px,100%);margin-top:18px;text-align:center}
.drive b{display:block;font-size:15px;margin-bottom:6px}
.drive span{font-size:13px;color:var(--muted);line-height:1.5;display:block;max-width:38ch;margin:0 auto}
.driveform{display:flex;gap:8px;margin-top:14px}
.driveform input{
  flex:1;min-width:0;font-family:var(--sans);font-size:13.5px;padding:10px 14px;
  border:1px solid #D8D4D0;border-radius:999px;background:#fff;color:#111;
}
.driveform input:focus{outline:none;border-color:#111}
.pick.solid{background:#111;color:#fff;border-color:#111}
.err{margin:12px 0 0;font-size:13px;color:#C4362F;line-height:1.45}
.loading{width:min(408px,100%);text-align:center;color:var(--muted);font-size:14px;padding:30px 0}

/* ---- drop zone ---- */
.drop{
  width:min(408px,100%);border:1.5px dashed #CFCBC7;border-radius:28px;background:#FBFAF9;
  padding:46px 24px;text-align:center;cursor:pointer;
}
.drop.hot{border-color:var(--pink);background:#FFF4FA}
.drop b{display:block;font-size:17px;margin-bottom:6px}
.drop span{font-size:14px;color:var(--muted);line-height:1.5}
.picks{display:flex;gap:10px;justify-content:center;margin-top:20px}
.pick{
  font-family:var(--sans);font-size:13.5px;font-weight:600;padding:9px 16px;border-radius:999px;
  border:1px solid #D8D4D0;background:#fff;color:#111;cursor:pointer;
}
.pick:hover{border-color:#111}
.sharerow{display:flex;flex-direction:column;align-items:center;gap:8px;margin-top:20px}
.share{
  font-family:var(--sans);font-size:14px;font-weight:600;padding:11px 22px;border-radius:999px;
  border:0;background:#111;color:#fff;cursor:pointer;display:flex;align-items:center;gap:8px;
}
.share:hover{background:#333}
.share.done{background:#1B9E4B}
.sharenote{font-size:12.5px;color:#A8A5A2;text-align:center;max-width:34ch;line-height:1.45}
.addrow{display:flex;gap:18px;margin-top:16px}
.add{font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer}
</style>

<p class="eyebrow">Nancy Hub</p>
<h1 id="title" contenteditable spellcheck="false">Untitled carousel</h1>
<p class="count" id="count">0 slides</p>

<label class="drop" id="drop">
  <b>Drop photos &amp; videos here</b>
  <span>Drop a whole folder, or select as many files as you like — they play in order, ascending by file name.<br>Nothing uploads anywhere; it all stays in this browser.</span>
  <span class="picks">
    <button type="button" class="pick" id="pickfiles">Choose files</button>
    <button type="button" class="pick" id="pickfolder">Choose a folder</button>
  </span>
  <input type="file" id="file" accept="image/*,video/*" multiple hidden>
  <input type="file" id="dir" webkitdirectory directory multiple hidden>
</label>

<div class="drive" id="drivebox">
  <b>Or paste a Google Drive folder link</b>
  <span>The folder must be shared &ldquo;anyone with the link&rdquo;. One folder = one carousel, and the link you get back works for everyone.</span>
  <form class="driveform" id="driveform">
    <input type="text" id="driveurl" placeholder="https://drive.google.com/drive/folders/…" spellcheck="false">
    <button class="pick solid" type="submit">Load</button>
  </form>
  <p class="err" id="err" hidden></p>
</div>

<div class="phone" id="phone" hidden>
  <div class="notch"></div>
  <div class="post">
    <div class="head">
      <div class="avatar"></div>
      <div class="handle" id="handle">Untitled carousel</div>
      <div class="dotsmenu">•••</div>
    </div>
    <div class="stage" id="stage">
      <div class="hit prev" id="hprev"></div>
      <div class="hit next" id="hnext"></div>
    </div>
    <div class="bar">
      <button class="arrow" id="prev">&#10094;</button>
      <div class="dots" id="dots"></div>
      <span class="idx" id="idx">1/1</span>
      <button class="arrow" id="next">&#10095;</button>
    </div>
    <div class="cap" id="cap" contenteditable spellcheck="false" data-ph="Write one caption for the whole carousel…"></div>
    <div class="acts">♡ &nbsp;✉ &nbsp;🔖</div>
  </div>
</div>
<div class="sharerow" id="sharerow" hidden>
  <button class="share" id="share">Share this view</button>
  <p class="sharenote" id="sharenote"></p>
</div>

<div class="addrow" id="addrow" hidden>
  <button class="add" id="addmore">add more</button>
  <button class="add" id="replace">start over</button>
</div>
<p class="hint">← → to navigate</p>

<script>
const $ = s => document.querySelector(s);
const stage=$('#stage'), dots=$('#dots'), idxEl=$('#idx'), cap=$('#cap'),
      title=$('#title'), handle=$('#handle'), countEl=$('#count'),
      phone=$('#phone'), drop=$('#drop'), fileIn=$('#file'), dirIn=$('#dir'),
      addmore=$('#addmore'), addrow=$('#addrow'),
      shareBtn=$('#share'), shareRow=$('#sharerow'), shareNote=$('#sharenote'),
      driveBox=$('#drivebox'), driveForm=$('#driveform'), driveUrl=$('#driveurl'), errEl=$('#err');
let appendNext=false;
let driveMode=false, driveFolder=null;

let slides=[], i=0;

/* natural ascending sort by file name: IMG_2 before IMG_10 */
const coll = new Intl.Collator(undefined,{numeric:true,sensitivity:'base'});

const isMedia = f => f.type.startsWith('image/') || f.type.startsWith('video/');
const nameOf = f => (f.webkitRelativePath || f.name);

function load(fileList,{append=false}={}){
  let files=[...fileList].filter(isMedia);
  if(!files.length) return;

  if(!append){
    slides.forEach(s=>{ if(s.blob) URL.revokeObjectURL(s.src); });
    [...stage.querySelectorAll('img,video')].forEach(n=>n.remove());
    slides=[];
  }else{
    const have=new Set(slides.map(s=>s.name));
    files=files.filter(f=>!have.has(nameOf(f)));
    if(!files.length){ render(); return; }
  }

  files.forEach(f=>{
    const url=URL.createObjectURL(f);
    const el=document.createElement(f.type.startsWith('video/')?'video':'img');
    el.src=url;
    if(el.tagName==='VIDEO'){ el.muted=true; el.loop=true; el.playsInline=true; el.controls=true; }
    stage.appendChild(el);
    slides.push({el,src:url,name:nameOf(f),blob:true});
  });

  /* one ascending sort by file name across everything loaded so far */
  slides.sort((a,b)=>coll.compare(a.name,b.name));
  slides.forEach(s=>stage.appendChild(s.el));

  i=0; drop.hidden=true; driveBox.hidden=true;
  phone.hidden=false; addrow.hidden=false; shareRow.hidden=false;
  render();
}

/* dropping a folder: walk it for every file inside */
async function filesFromDrop(dt){
  const items=[...dt.items].map(it=>it.webkitGetAsEntry&&it.webkitGetAsEntry()).filter(Boolean);
  if(!items.length) return [...dt.files];
  const out=[];
  const readDir = d => new Promise(res=>{
    const r=d.createReader(), all=[];
    (function next(){ r.readEntries(e=>{ e.length ? (all.push(...e), next()) : res(all); }, ()=>res(all)); })();
  });
  const walk = async e => {
    if(e.isFile){ await new Promise(r=>e.file(f=>{ out.push(f); r(); }, r)); }
    else if(e.isDirectory){ for(const c of await readDir(e)) await walk(c); }
  };
  for(const e of items) await walk(e);
  return out;
}

function render(){
  slides.forEach((s,n)=>{
    const on = n===i;
    s.el.classList.toggle('on',on);
    if(s.el.tagName==='VIDEO'){ on ? s.el.play().catch(()=>{}) : s.el.pause(); }
  });
  dots.innerHTML = slides.map((_,n)=>`<i class="dot${n===i?' on':''}"></i>`).join('');
  idxEl.textContent = `${i+1}/${slides.length}`;
  countEl.textContent = `${slides.length} slide${slides.length===1?'':'s'}`;
  $('#prev').disabled = i===0;
  $('#next').disabled = i===slides.length-1;
}
const go = d => { i=Math.min(slides.length-1,Math.max(0,i+d)); render(); };

$('#prev').onclick=()=>go(-1); $('#next').onclick=()=>go(1);
$('#hprev').onclick=()=>go(-1); $('#hnext').onclick=()=>go(1);
addEventListener('keydown',e=>{
  if(document.activeElement.isContentEditable) return;
  if(e.key==='ArrowLeft')go(-1); if(e.key==='ArrowRight')go(1);
});

/* swipe */
let x0=null;
stage.addEventListener('touchstart',e=>x0=e.touches[0].clientX,{passive:true});
stage.addEventListener('touchend',e=>{
  if(x0===null)return; const dx=e.changedTouches[0].clientX-x0;
  if(Math.abs(dx)>44) go(dx<0?1:-1); x0=null;
},{passive:true});

/* files */
fileIn.onchange=e=>{ load(e.target.files,{append:appendNext}); e.target.value=''; };
dirIn.onchange=e=>{ load(e.target.files,{append:appendNext}); e.target.value=''; };
$('#pickfiles').onclick=e=>{e.preventDefault();appendNext=false;fileIn.click()};
$('#pickfolder').onclick=e=>{e.preventDefault();appendNext=false;dirIn.click()};
addmore.onclick=()=>{appendNext=true;fileIn.click()};
$('#replace').onclick=()=>{appendNext=false;fileIn.click()};
['dragenter','dragover'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('hot')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('hot')}));
drop.addEventListener('drop',e=>load(e.dataTransfer.files));
addEventListener('dragover',e=>e.preventDefault());
addEventListener('drop',e=>{e.preventDefault(); if(!phone.hidden) return; load(e.dataTransfer.files)});

/* ---- drive ----
   A local file has no URL anyone else can open, so a shared link can only
   carry the media when the media already lives somewhere public. Drive is
   that somewhere: the folder id travels in the link, the listing is read at
   view time, and the bytes come back through our own origin because Drive
   sends same-site CORP (see api/drive-video.js). Nothing is uploaded or
   stored here -- one folder is one carousel, and there can be as many as
   there are folders. */
function folderId(input){
  const t=(input||'').trim();
  const m=t.match(/\/folders\/([\w-]{10,})/) || t.match(/[?&]id=([\w-]{10,})/);
  if(m) return m[1];
  return /^[\w-]{10,}$/.test(t) ? t : null;
}

function showErr(msg){ errEl.textContent=msg; errEl.hidden=!msg; }

async function loadDrive(fid,{push=true}={}){
  showErr('');
  driveForm.querySelector('button').textContent='Loading…';
  let data;
  try{
    const r=await fetch(`/api/drive-folder?id=${encodeURIComponent(fid)}`);
    data=await r.json();
    if(!r.ok) throw new Error(data.error||'failed');
  }catch(e){
    driveForm.querySelector('button').textContent='Load';
    showErr(e.message==='not-shared'
      ? 'That folder is not shared publicly. In Drive: Share → General access → Anyone with the link, then try again.'
      : 'Could not read that folder. Check the link and try again.');
    return;
  }
  driveForm.querySelector('button').textContent='Load';

  if(!data.files.length){ showErr('No photos or videos in that folder.'); return; }

  slides.forEach(s=>{ if(s.blob) URL.revokeObjectURL(s.src); });
  [...stage.querySelectorAll('img,video')].forEach(n=>n.remove());
  slides=[];

  data.files.forEach(f=>{
    const el=document.createElement(f.kind==='video'?'video':'img');
    el.src=`/api/drive-video?id=${f.id}`;
    if(el.tagName==='VIDEO'){ el.muted=true; el.loop=true; el.playsInline=true; el.controls=true; el.preload='metadata'; }
    stage.appendChild(el);
    slides.push({el,src:el.src,name:f.name});
  });

  driveMode=true; driveFolder=fid;
  i=0; drop.hidden=true; driveBox.hidden=true;
  phone.hidden=false; addrow.hidden=true; shareRow.hidden=false;
  render(); shareNoteText();

  if(push){
    const u=new URL(location.href); u.searchParams.set('f',fid);
    history.replaceState(null,'',u);
  }
}

driveForm.addEventListener('submit',e=>{
  e.preventDefault();
  const fid=folderId(driveUrl.value);
  if(!fid){ showErr('That does not look like a Drive folder link.'); return; }
  loadDrive(fid);
});

/* ---- share ----
   The media is local: object URLs are dead outside this tab and nothing is
   uploaded. So the link carries what IS portable -- title and caption, packed
   into the hash -- and says so under the button rather than quietly
   half-working. */
function b64(str){
  const bytes=new TextEncoder().encode(str);
  return btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function unb64(str){
  const bin=atob(str.replace(/-/g,'+').replace(/_/g,'/'));
  return new TextDecoder().decode(Uint8Array.from(bin,c=>c.charCodeAt(0)));
}
function shareURL(){
  const u=new URL(location.href);
  if(driveFolder) u.searchParams.set('f',driveFolder);
  u.hash='s='+b64(JSON.stringify({t:title.textContent.trim(),c:cap.textContent}));
  return u.toString();
}
async function doShare(){
  const url=shareURL();
  const data={title:title.textContent.trim()||'Carousel review',text:cap.textContent.slice(0,180),url};
  if(navigator.share && (!navigator.canShare || navigator.canShare(data))){
    try{ await navigator.share(data); return; }catch(e){ if(e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(url); }
  catch(e){ prompt('Copy this link:',url); return; }
  const was=shareBtn.textContent;
  shareBtn.textContent='Link copied';
  shareBtn.classList.add('done');
  setTimeout(()=>{shareBtn.textContent=was;shareBtn.classList.remove('done')},1800);
}
function shareNoteText(){
  shareNote.textContent = driveMode
    ? 'Anyone with the link sees these slides and this caption.'
    : 'The link carries the title and caption. Your files stay on this machine \u2014 send the folder alongside it, or load from Drive for a link that shows the slides too.';
}

/* title + caption persist locally */
const K='carousel-review';
let saved=JSON.parse(localStorage.getItem(K)||'{}');
const hash=new URLSearchParams(location.hash.slice(1)).get('s');
if(hash){ try{ const h=JSON.parse(unb64(hash)); saved={title:h.t,cap:h.c}; }catch(e){} }
if(saved.title){ title.textContent=saved.title; handle.textContent=saved.title; }
if(saved.cap) cap.textContent=saved.cap;
const save=()=>localStorage.setItem(K,JSON.stringify({title:title.textContent.trim(),cap:cap.textContent}));
title.addEventListener('input',()=>{handle.textContent=title.textContent.trim()||'Untitled carousel';save()});
cap.addEventListener('input',save);
shareBtn.onclick=doShare;
shareNoteText();

/* A visitor arriving on a shared link gets the carousel, not the uploader. */
const boot=new URLSearchParams(location.search).get('f');
if(boot) loadDrive(boot,{push:false});
</script>
