      const cur = db().reports[rep.id];
      let v = E.num(el.value);
      if (v != null && el.dataset.pct && v > 1) v = v / 100;          // "62" and "62%" both mean 0.62
      save({ account: { ...(cur.account || {}), [el.dataset.acc]: v } }); render();
    });
    body.querySelector("#o-add").onclick = () => {
      const lines = body.querySelector("#o-text").value.split("\n").map(l => l.split(/\t|,/).map(s => s.trim())).filter(x => x[0])
        .map(([label, amount, currency]) => ({ label, amount: E.num(amount), currency: (currency || "USD").toUpperCase() })).filter(l => l.amount != null);
      if (!lines.length) return toast("Use: label, amount, currency");
      const cur = db().reports[rep.id]; save({ otherSpend: [...(cur.otherSpend || []), ...lines] }); render();
    };
  }
  const keyOf = { infl: "influencers", cost: "eventCosts", other: "otherSpend" };
  body.querySelectorAll("[data-rmline]").forEach(b => b.onclick = () => {
    const [k, i] = b.dataset.rmline.split(":"); const cur = db().reports[rep.id];
    save({ [keyOf[k]]: (cur[keyOf[k]] || []).filter((_, j) => j !== +i) }); render();
  });
}
function costList(list, k, fmt){
  return list.length ? `<div class="list">${list.map((l, i) => `<div class="li"><span class="grow">${fmt(l)}</span><button class="x" data-rmline="${k}:${i}">×</button></div>`).join("")}</div>` : "";
}
function accField(k, label, rep, pct){
  const v = rep.account?.[k];
  const shown = v == null ? "" : pct ? (v * 100).toFixed(2).replace(/\.?0+$/, "") + "%" : v;
  return `<label class="f">${label}<input type="text" data-acc="${k}" ${pct ? 'data-pct="1"' : ""} value="${shown}"></label>`;
}

/* ───────── ad matching ───────── */
function renderMatch(body, rep, R, D){
  const allPosts = Object.values(D.posts).sort((a, b) => (a.date < b.date ? 1 : -1));
  const inRep = new Set(R.contentRows.map(r => r.id));
  const where = new Map();
  for (const r of R.rows) for (const a of r.ads) where.set(a.key, r);
  const HOW = { id: "Post ID / permalink", name: "Ad name ≈ caption", manual: "Set by hand", "manual-adonly": "Set by hand", none: "No match" };
  const rows = R.matchLog.map(m => {
    const r = where.get(m.ad.key);
    const opt = p => `<option value="${p.id}" ${rep.adMatch?.[m.ad.key] === p.id ? "selected" : ""}>${inRep.has(p.id) ? "★ " : ""}${esc(F.date(p.date))} · ${esc((p.content || p.id).slice(0, 50))}</option>`;
    return `<tr class="${m.how === "name" ? "extra" : m.how === "none" ? "adrow" : ""}">
      <td class="cap">${esc(m.ad.ad)}</td><td class="cap">${esc(m.ad.campaign)}</td><td class="n">${F.int(m.ad.views)}</td><td class="n">${F.usd(m.ad.usd)}</td>
      <td>${esc(HOW[m.how] || m.how)}</td><td class="small">${r ? `${esc(KIND[r.kind] || (rep.type === "week" ? "This week's post" : "Event post"))}${r.post ? " · " + link(r, 30) : ""}` : ""}</td>
      <td><select data-match="${m.ad.key}"><option value="">Automatic</option><option value="__adonly" ${rep.adMatch?.[m.ad.key] === "__adonly" ? "selected" : ""}>Ad only (no post)</option>${allPosts.filter(p => inRep.has(p.id)).map(opt).join("")}<optgroup label="Other posts">${allPosts.filter(p => !inRep.has(p.id)).slice(0, 200).map(opt).join("")}</optgroup></select></td></tr>`;
  });
  body.innerHTML = `<div class="sec"><h2>How each ad was matched</h2>
    <p class="sub" style="margin:-4px 0 14px">Order: post ID or permalink in the export → ad name vs caption (“… - Copy” counts as the same ad) → the fit rule: an ad is credited only if the post's paid views stay at or under its Instagram views, smallest ads first. Ads that don't fit ran on a dark-post copy and get their own row. Rows matched by name are shaded — check them. Pick a post by hand to override.</p>
    ${R.matchLog.length ? tbl("t-match", ["Ad name", "Campaign", N("Views"), N("Spend (USD)"), "Matched by", "Ended up as", "Override"], rows) : `<div class="empty">No ad exports attached yet. <a href="#/r/${rep.id}/data">Add data</a></div>`}
  </div>`;
  body.querySelectorAll("[data-copy]").forEach(b => b.onclick = () => copy(tableTSV(document.getElementById(b.dataset.copy)), "Table copied"));
  body.querySelectorAll("[data-match]").forEach(s => s.onchange = () => {
    const cur = db().reports[rep.id];
    const adMatch = { ...(cur.adMatch || {}) };
    if (s.value) adMatch[s.dataset.match] = s.value; else delete adMatch[s.dataset.match];
    put("ss.report." + rep.id, { ...cur, adMatch }); render();
  });
}

/* ───────── compare any two reports ───────── */
function renderCompare(D, q){
  const reps = Object.values(D.reports).sort((a, b) => ((a.start || "") < (b.start || "") ? 1 : -1));
  const a = D.reports[q.get("a")], b = D.reports[q.get("b")];
  const opts = sel => reps.map(r => `<option value="${r.id}" ${sel?.id === r.id ? "selected" : ""}>${r.type === "week" ? "Week" : "Event"} · ${esc(r.name)}</option>`).join("");
  let out = "";
  if (a && b) {
    const A = E.buildReport(a, D, D.settings), B = E.buildReport(b, D, D.settings);
    const side = (X, Y) => X.breakdown.map((g, i) => `<tr><td>${g.name}</td><td class="n">${g.posts} / ${Y.breakdown[i].posts}</td><td class="n">${F.int(g.views)} / ${F.int(Y.breakdown[i].views)}</td><td class="n">${vsBench(g.er, X.bench)} / ${vsBench(Y.breakdown[i].er, X.bench)}</td></tr>`);
    out = `<div class="sec"><h2>${esc(a.name)} vs ${esc(b.name)}</h2>${cmpTable("t-c", A, B, a.name, b.name)}
      <p class="small dim">Data dates: ${F.dateY(A.dataDate)} vs ${F.dateY(B.dataDate)}${A.dataDate !== B.dataDate ? " — different pull dates, so older content has had more time to collect views." : ""}</p></div>
      <div class="sec"><h2>Content breakdown</h2>${tbl("t-cb", ["", N("Posts"), N("Views"), N("Eng. rate")], side(A, B))}</div>`;
  }
  app.innerHTML = `<h1>Compare</h1><p class="sub">Any two reports side by side — week vs week, event vs event, or an event against the week it happened in.</p>
    <div class="card sec row"><select id="ca"><option value="">First report…</option>${opts(a)}</select><span class="muted">vs</span><select id="cb"><option value="">Second report…</option>${opts(b)}</select></div>${out}`;
  const go = () => { location.hash = `#/compare?a=${document.getElementById("ca").value}&b=${document.getElementById("cb").value}`; };
  document.getElementById("ca").onchange = go; document.getElementById("cb").onchange = go;
  app.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copy(tableTSV(document.getElementById(btn.dataset.copy)), "Table copied"));
}

/* ───────── library: posts ───────── */
function renderPosts(D, q){
  const term = (q.get("q") || "").toLowerCase();
  const evOf = id => Object.values(D.reports).filter(r => r.type === "event" && (r.postIds || []).includes(id)).map(r => r.name);
  const list = Object.values(D.posts).filter(p => !term || `${p.content} ${p.account} ${p.id}`.toLowerCase().includes(term)).sort((a, b) => ((a.date || "") < (b.date || "") ? 1 : -1));
  const rows = list.map(p => {
    const { snap, date } = E.snapAt(p, null);
    const pulls = Object.keys(p.snaps || {}).length;
    return `<tr><td>${F.date(p.date)}</td><td>${who(p)}</td><td>${esc(p.format)}</td><td class="cap">${link(p, 50)}</td><td class="n">${F.int(snap?.views)}</td><td class="small">${F.date(date)}${pulls > 1 ? ` (+${pulls - 1} earlier)` : ""}</td><td>${chip(!!p.boosted)}</td><td class="small">${esc(evOf(p.id).join(", ") || "—")}</td><td><button class="x" data-delp="${p.id}" title="Delete post">×</button></td></tr>`;
  });
  app.innerHTML = `<h1>Posts</h1><p class="sub">Every post ever pasted in, stored once by its link. Each paste adds a dated snapshot — older numbers are kept.</p>
    <div class="sec row"><input type="text" id="ps" placeholder="Search caption, account, link…" value="${esc(q.get("q") || "")}" style="flex:1;max-width:420px"><span class="muted small">${list.length} posts</span></div>
    <div class="sec">${list.length ? tbl("t-lib", ["Posted", "Account", "Format", "Content", N("Latest views"), "Pulled", "Boosted", "Events", ""], rows) : `<div class="empty">No posts yet — add them inside a report.</div>`}</div>`;
  const ps = document.getElementById("ps");
  ps.onchange = () => { location.hash = `#/posts?q=${encodeURIComponent(ps.value)}`; };
  app.querySelectorAll("[data-delp]").forEach(b => b.onclick = () => { if (confirm("Delete this post from every report?")) { del("ss.post." + b.dataset.delp); render(); } });
  app.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copy(tableTSV(document.getElementById(btn.dataset.copy)), "Table copied"));
}

/* ───────── library: ad exports ───────── */
function renderAds(D){
  const used = id => Object.values(D.reports).filter(r => (r.importIds || []).includes(id)).map(r => r.name);
  const fx = D.settings.fx;
  const list = Object.values(D.imports).sort((a, b) => ((a.uploaded || "") < (b.uploaded || "") ? 1 : -1));
  const rows = list.map(i => {
    const spend = i.rows.reduce((s, r) => s + (E.toUSD(r.spend, r.currency, fx) || 0), 0);
    const views = i.rows.reduce((s, r) => s + (r.views || 0), 0);
    return `<tr><td>${esc(i.name)}</td><td>${i.level}</td><td>${F.date(i.rangeStart)} → ${F.date(i.rangeEnd)}</td><td class="n">${i.rows.length}</td><td class="n">${F.usd(spend)}</td><td class="n">${F.int(views)}</td><td class="n">${F.usd(views ? spend / views * 1000 : null)}</td><td class="small">${esc(used(i.id).join(", ") || "—")}</td><td class="small">${esc((i.warnings || []).join(" "))}</td><td><button class="x" data-deli="${i.id}">×</button></td></tr>`;
  });
  app.innerHTML = `<h1>Ad exports</h1><p class="sub">Every Meta Ads Manager export uploaded. One export can feed several reports (a weekly report and an event report). Spend shown at default FX.</p>
    <div class="sec">${list.length ? tbl("t-imp", ["File", "Level", "Range", N("Rows"), N("Spend (USD)"), N("Views"), N("CPM"), "Used in", "Warnings", ""], rows) : `<div class="empty">No exports yet — upload them inside a report.</div>`}</div>`;
  app.querySelectorAll("[data-deli]").forEach(b => b.onclick = () => { if (confirm("Delete this export? Reports using it will lose its ads.")) { del("ss.import." + b.dataset.deli); render(); } });
  app.querySelectorAll("[data-copy]").forEach(btn => btn.onclick = () => copy(tableTSV(document.getElementById(btn.dataset.copy)), "Table copied"));
}

/* ───────── settings ───────── */
function renderSettings(D){
  const s = D.settings;
  app.innerHTML = `<h1>Settings</h1><p class="sub">Defaults for new reports. Each report keeps its own copy of the FX rates, so changing them here doesn't change old reports.</p>
  <div class="sec grid g2">
    <div class="card"><h3>Targets &amp; benchmarks</h3><div class="fields" style="margin-top:10px">
      <label class="f">Account views target<input type="text" id="s-tv" value="${s.target.views}"></label>
      <label class="f">Per<select id="s-tp">${["week", "month", "quarter"].map(p => `<option ${s.target.period === p ? "selected" : ""}>${p}</option>`).join("")}</select></label>
      <label class="f">Eng. rate benchmark %<input type="text" id="s-b" value="${(s.benchmark * 100).toFixed(2)}"></label>
      <label class="f">Normal ads CPM from $<input type="text" id="s-c0" value="${s.cpmRange[0]}"></label>
      <label class="f">to $<input type="text" id="s-c1" value="${s.cpmRange[1]}"></label>
    </div><p class="small dim">Weekly reports prorate the target to the report's days. Benchmark: brand accounts ~1.9% per view (beauty ~2.1%), Dash Social 2026.</p></div>
    <div class="card"><h3>Default FX (USD per 1 unit)</h3><div class="fields" style="margin-top:10px">
      ${Object.entries(s.fx).filter(([c]) => c !== "USD").map(([c, v]) => `<label class="f">${c}<input type="text" data-sfx="${c}" value="${v}"></label>`).join("")}
    </div></div>
    <div class="card"><h3>Sync &amp; backup</h3>
      <p class="sub">Status: <b>${document.getElementById("sync").innerText}</b>. Data is shared through the Vercel API (Upstash). If it says “This browser only”, the API isn't live yet and everything is saved in this browser.</p>
      <div class="row" style="margin-top:12px"><button class="btn sm" id="bk">Download backup</button><label class="btn ghost sm">Restore backup<input type="file" id="rs" accept=".json" hidden></label><button class="btn ghost sm" id="pc">Team passcode</button></div>
    </div>
  </div>`;
  const saveS = patch => { put("ss.settings", { ...(docs["ss.settings"] || {}), ...patch }); render(); };
  document.getElementById("s-tv").onchange = e => saveS({ target: { ...s.target, views: E.num(e.target.value) || s.target.views } });
  document.getElementById("s-tp").onchange = e => saveS({ target: { ...s.target, period: e.target.value } });
  document.getElementById("s-b").onchange = e => saveS({ benchmark: (E.num(e.target.value) || 1.9) / 100 });
  document.getElementById("s-c0").onchange = e => saveS({ cpmRange: [E.num(e.target.value) || 4, s.cpmRange[1]] });
  document.getElementById("s-c1").onchange = e => saveS({ cpmRange: [s.cpmRange[0], E.num(e.target.value) || 17] });
  app.querySelectorAll("[data-sfx]").forEach(el => el.onchange = () => saveS({ fx: { ...s.fx, [el.dataset.sfx]: E.num(el.value) } }));
  document.getElementById("bk").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([JSON.stringify(docs, null, 1)], { type: "application/json" }));
    a.download = `social-stats-backup-${today()}.json`; a.click();
  };
  document.getElementById("rs").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    try {
      const data = JSON.parse(await f.text()); let n = 0;
      for (const [k, v] of Object.entries(data)) if (/^ss\./.test(k) && v && (!docs[k] || (v.updatedAt || 0) > (docs[k].updatedAt || 0))) { docs[k] = v; sync.queue(k); n++; }
      saveLocal(); render(); toast(`Restored ${n} newer records`);
    } catch { toast("That file isn't a Social Stats backup"); }
  };
  document.getElementById("pc").onclick = askPass;
}

render();
sync.pull();
</script>
</html>
